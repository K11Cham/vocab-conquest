xample":"Ghana and Mali controlled gold, ivory, and slaves selling to Muslim traders for salt, copper, and cloth.","spice":["Political","Environmental Interaction"],"process":["State Formation & Expansion","Expansion of Trade Networks"],"why":"Environment shapes trade in a region. States who can take advantage of that environment controlling strategic resources or locations gain power. States gained influence by taxing trade and controlling valuable resources and routes."},{"term":"State Building in East Africa","unit":1,"definition":"States adapted to the environment to grow and thrive.","example":"Zimbabwe was remote but used gold to gain influence in Indian Ocean trade. Many people moved there causing it to overgraze the land and collapse. Ethiopia was in remote mountains. Less influenced by Muslim merchants and forced on self-reliance.","spice":["Political","Environmental Interaction"],"process":["State Formation & Expansion","Environmental Adaptation & Change"],"why":"People must creatively used their resources to develop. Societies in strategic locations use it to control and tax trade. Societies with valuable resources use to it to trade for things difficult for them to produce. Environmental conditions and access to trade shaped different paths to political and economic power."},{"term":"Manorial System","unit":1,"definition":"System in Europe of self-sufficient estates that produced everything they needed.","example":"Collapse of the Roman Empire led to collapse in trade in Europe forcing new societies to take care of their own needs and slowing development.","spice":["Social","Economic"],"process":["Social Organization & Change","Economic Transformation"],"why":"Manors organized agricultural labor and local obligations in much of medieval Europe. Agricultural production supported regional populations, while the growth of towns and trade gradually changed many of these relationships."},{"term":"European Challenges to Authority","unit":1,"definition":"European trend to shift from theocracy and god kings towards democracy.","example":"1215, nobles forced English king to sign Magna Carta limiting the kings power and leading to a parliament. Great Schism split Christianity to Catholic and Eastern Orthodox, challenging authority of priests to establish rulers.","spice":["Political","Cultural"],"process":["Legitimization & Challenges to Authority","Political Fragmentation"],"why":"Conflicts involving monarchs, nobles, towns, and religious institutions created limits and challenges to some established authorities. These struggles did not establish modern democracy immediately, but they reshaped later political institutions."},{"term":"Primogeniture","unit":1,"definition":"System where eldest son inherits all of a family's land upon death of its patriarch.","example":"The death of a king would lead to the 1st prince inheriting the throne.","spice":["Social","Political"],"process":["Social Organization & Change","Legitimization & Challenges to Authority"],"why":"If one child inherits everything, then the others get nothing. This pressures European men to fight and explore to secure wealth if they were not 1st in-line to inherit. Also leads to many conflicts to seize the full inheritance. Concentrating inheritance in one heir could preserve estates while creating rivalries among relatives."},{"term":"Crusades","unit":1,"definition":"Islamic expansion towards Europe leads to call by Catholic Church for all Christians to take Jerusalem, a Christian holy city.","example":"Crusades temporarily united feuding Christian kingdoms in a single goal of defeating Islam rule in modern day Israel/Palestine.","spice":["Political","Cultural"],"process":["Legitimization & Challenges to Authority","State Formation & Expansion"],"why":"The Pope may have called to try to strengthen his authority and try to unite Europe into something like a Roman Empire. The crusades led to Europe being reintroduced to the Silk Road, lost technologies, and increasing their desire to trade across the world."},{"term":"Renaissance","unit":1,"definition":"Crusades and resulting growth in trade leads to a rebirth of European interest in arts and sciences. New ideas spread that will lead to the modern world.","example":"Idea of humanism that people are individuals and not part of a machine or state. Focused on people learning to read and write.","spice":["Social","Cultural"],"process":["Cultural Syncretism & Reform","Cultural Diffusion"],"why":"Begins process of weakening Catholic Church authority, leading to rise of more secular governments and idea of nationalism, that people are unified by culture and beliefs and not an all powerful god emperor or unaccountable authority."}]};

const UNITS = {
  1: { name: "The Global Tapestry",           yrs: "1200–1450" },
  2: { name: "Networks of Exchange",          yrs: "1200–1450" },
  3: { name: "Land-Based Empires",            yrs: "1450–1750" },
  4: { name: "Transoceanic Interconnections", yrs: "1450–1750" },
};
const SPICE = ["Social", "Political", "Environmental Interaction", "Cultural", "Economic", "Technology"];
const PROCESSES = DATA.processes;               // the 12 Key Processes, in your chart's order

function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
const CARDS = DATA.cards.map(c => Object.assign({ id: slug(c.term) }, c));
const BYID = {};
CARDS.forEach(c => { BYID[c.id] = c; });

/* ---- 2. Small helpers ----------------------------------------------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
function shuffle(a) {                            // Fisher-Yates, returns a new array
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));

/* ---- 3. Saved state ------------------------------------------------------- */
/* S.cards[id] = per-card memory:
     b    Leitner box 0-5 (0 = new or forgotten, 5 = rock solid)
     due  timestamp when it should be reviewed again
     seen / ok / bad   how many times answered, right, wrong
     tg / tt           SPICE-T and Process points earned / possible (tag drills + mock tests)
     last timestamp of the latest answer                                              */
const KEY = "vocab-conquest-v1";
const DAY = 864e5;
const STEPS = [0, 10 * 60e3, DAY, 3 * DAY, 7 * DAY, 16 * DAY];   // wait time for each box

function freshState() { return { v: 1, u: 0, cards: {}, xp: 0, days: {}, testDate: "", bestLightning: 0, sessions: 0 }; }
let S = freshState();

function adopt(obj) {                            // accept saved data, tolerate junk
  const f = freshState();
  if (obj && typeof obj === "object") {
    f.u = +obj.u || 0; f.xp = +obj.xp || 0; f.testDate = typeof obj.testDate === "string" ? obj.testDate : "";
    f.bestLightning = +obj.bestLightning || 0; f.sessions = +obj.sessions || 0;
    if (obj.days && typeof obj.days === "object") f.days = obj.days;
    if (obj.cards && typeof obj.cards === "object") {
      for (const id in obj.cards) if (BYID[id]) {
        const c = obj.cards[id] || {};
        f.cards[id] = { b: Math.min(5, Math.max(0, +c.b || 0)), due: +c.due || 0, seen: +c.seen || 0, ok: +c.ok || 0,
                        bad: +c.bad || 0, tg: +c.tg || 0, tt: +c.tt || 0, last: +c.last || 0 };
      }
    }
  }
  S = f;
}
function loadLocal() { try { const raw = localStorage.getItem(KEY); if (raw) adopt(JSON.parse(raw)); } catch (e) { /* storage blocked: start fresh */ } }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
function save() { S.u = Date.now(); saveLocal(); if (typeof queueSync === "function") queueSync(); }

const ZERO = Object.freeze({ b: 0, due: 0, seen: 0, ok: 0, bad: 0, tg: 0, tt: 0, last: 0 });
const getC = id => S.cards[id] || ZERO;
function mut(id) { return S.cards[id] || (S.cards[id] = { b: 0, due: 0, seen: 0, ok: 0, bad: 0, tg: 0, tt: 0, last: 0 }); }

/* tier: 0 = untouched, 1 = learning, 2 = familiar, 3 = mastered (box 4-5) */
function tier(id) { const c = getC(id); if (!c.seen) return 0; return c.b >= 4 ? 3 : c.b >= 2 ? 2 : 1; }
const isDue = id => { const c = getC(id); return c.seen > 0 && c.due <= Date.now(); };

/* ---- 4. Spaced repetition -------------------------------------------------
   q = 0 Again, 1 Hard, 2 Good, 3 Easy.
   Again drops the card to box 0. Hard keeps its box. Good moves up one box,
   Easy moves up two. The box decides how long until you see it again.
   `cap` limits how high a lower-effort mode (multiple choice) may lift a card. */
function nextState(c, q, cap) {
  const top = cap == null ? 5 : cap;
  let b = c.b;
  if (q === 0) b = 0;
  else if (q === 1) b = Math.max(1, Math.min(b, top));
  else b = Math.min(top, Math.max(b, b + (q === 3 ? 2 : 1)));
  const wait = q === 0 ? 60e3 : q === 1 ? Math.max(STEPS[b] * 0.5, 10 * 60e3) : STEPS[b];
  return { b, wait };
}
function waitLabel(ms) {
  if (ms < 90e3) return "<1m";
  if (ms < 3600e3) return Math.round(ms / 60e3) + "m";
  if (ms < DAY) return Math.round(ms / 3600e3) + "h";
  return Math.round(ms / DAY) + "d";
}

function dayKey(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function addXP(n) {
  S.xp += n;
  const k = dayKey(); const d = S.days[k] || (S.days[k] = { n: 0, xp: 0 });
  d.xp += n;
}
function grade(id, q, opts) {
  opts = opts || {};
  const c = mut(id), now = Date.now();
  const nx = nextState(c, q, opts.cap);
  c.b = nx.b; c.due = now + nx.wait; c.last = now; c.seen++;
  if (q === 0) c.bad++; else c.ok++;
  const k = dayKey(); (S.days[k] || (S.days[k] = { n: 0, xp: 0 })).n++;
  if (opts.xp) addXP(opts.xp);
  save();
}

/* ---- 5. Ranks, streak, stats ---------------------------------------------- */
const RANKS = [
  ["Nomad", 0], ["Caravaneer", 120], ["Scribe", 350], ["Bureaucrat", 700],
  ["Daimyo", 1200], ["Vizier", 1900], ["Sultan", 2800], ["Great Khan", 4000],
];
function rankInfo(xp) {
  xp = xp == null ? S.xp : xp;
  let i = 0; while (i + 1 < RANKS.length && xp >= RANKS[i + 1][1]) i++;
  const cur = RANKS[i], nxt = RANKS[i + 1];
  return { i, name: cur[0], next: nxt ? nxt[0] : null, pct: nxt ? (xp - cur[1]) / (nxt[1] - cur[1]) : 1, toNext: nxt ? nxt[1] - xp : 0 };
}
function streak() {
  let n = 0; const d = new Date();
  if (!(S.days[dayKey(d)] && S.days[dayKey(d)].n)) d.setDate(d.getDate() - 1);   // today not studied yet: count from yesterday
  while (S.days[dayKey(d)] && S.days[dayKey(d)].n) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function poolOf(units) { return CARDS.filter(c => units.has(c.unit)); }
function stats(pool) {
  const t = [0, 0, 0, 0]; let due = 0;
  pool.forEach(c => { t[tier(c.id)]++; if (isDue(c.id)) due++; });
  return { t, due, total: pool.length, unseen: t[0] };
}
function daysLeft() {
  if (!S.testDate) return null;
  const end = new Date(S.testDate + "T00:00:00"), now = new Date(); now.setHours(0, 0, 0, 0);
  const n = Math.round((end - now) / DAY);
  return isNaN(n) ? null : n;
}
function newPerDay(pool) {
  const unseen = pool.filter(c => !getC(c.id).seen).length, left = daysLeft();
  if (left != null && left > 0) return Math.min(30, Math.max(5, Math.ceil(unseen / Math.max(1, left - 2))));
  return 12;
}

/* Smart queue: overdue cards first (most overdue first), then new cards up to
   the daily quota, then the weakest cards to fill the session. */
function buildQueue(pool, size) {
  const due = pool.filter(c => isDue(c.id)).sort((a, b) => getC(a.id).due - getC(b.id).due);
  const fresh = shuffle(pool.filter(c => !getC(c.id).seen)).slice(0, newPerDay(pool));
  let q = due.concat(fresh).slice(0, size);
  if (q.length < size) {
    const have = new Set(q.map(c => c.id));
    const weak = pool.filter(c => !have.has(c.id) && getC(c.id).seen)
      .sort((a, b) => getC(a.id).b - getC(b.id).b || getC(a.id).due - getC(b.id).due);
    q = q.concat(weak.slice(0, size - q.length));
  }
  return q.map(c => c.id);
}

   Each view function returns { html, dock, after }:
     html  goes in #app, dock goes in the fixed bottom bar, after() runs once drawn.
   Clicks are handled in one place: any element with data-act="name" calls ACT[name].
   ========================================================================== */

let view = "home";                       // home | flip | mc | tags | mockSetup | mock | mockDone | summary
let FILTER = new Set([1, 2, 3, 4]);      // which units the sessions draw from
let SES = null;                          // the running study session (see part 3)
let sheetId = null;                      // card open in the detail sheet
let syncState = "local";                 // local | cloud (set by part 4)
const ACT = {};                          // click handlers
const KEYS = {};                         // per-view keyboard handlers

const labelSpice = s => s === "Environmental Interaction" ? "Env. Interaction" : s;
const chipRow = list => '<div class="chips">' + list.map(x => '<span class="chip static">' + esc(x) + "</span>").join("") + "</div>";

/* The full answer side of a card: all five parts of your chart entry. */
function cardBack(c) {
  return (c.flag ? '<div class="note">' + esc(c.flag) + "</div>" : "") +
    '<div class="sect"><span class="label">Definition</span><p>' + esc(c.definition) + "</p></div>" +
    '<div class="sect"><span class="label">Unit ' + c.unit + " example</span><p>" + esc(c.example) + "</p></div>" +
    '<div class="sect"><span class="label">SPICE-T</span>' + chipRow(c.spice.map(labelSpice)) + "</div>" +
    '<div class="sect"><span class="label">Process</span>' + chipRow(c.process) + "</div>" +
    '<div class="sect"><span class="label">Why it matters</span><p>' + esc(c.why) + "</p></div>";
}

function toast(msg) {
  const t = $("toast"); t.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>";
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.innerHTML = ""; }, 2600);
}

function render() {
  const v = { home: homeView, flip: flipView, mc: mcView, tags: tagsView, mockSetup: mockSetupView,
              mock: mockView, mockDone: mockDoneView, summary: summaryView }[view]();
  $("app").innerHTML = v.html;
  $("dock").innerHTML = v.dock ? '<div class="dock"><div class="dock-in">' + v.dock + "</div></div>" : "";
  document.body.classList.toggle("has-dock", !!v.dock);
  renderSheet();
  updateSyncBadge();
  if (v.after) v.after();
}
function go(v) { view = v; render(); window.scrollTo(0, 0); }

function updateSyncBadge() {
  const el = $("syncBadge");
  if (el) el.textContent = syncState === "cloud" ? "Progress saved to your account" : "Progress saved on this device";
}

/* ---- Home ----------------------------------------------------------------- */
function homeView() {
  const pool = poolOf(FILTER), st = stats(pool), r = rankInfo(), sk = streak();
  const all = stats(CARDS);
  const queue = buildQueue(pool, 20), newN = Math.min(st.unseen, newPerDay(pool));
  const left = daysLeft();
  const planText = left == null ? "Set your test date and the app paces new cards for you."
    : left < 0 ? "That date has passed. Pick the new test date."
    : left === 0 ? "Test day. Run a mock test, then rest."
    : left + (left === 1 ? " day" : " days") + " left. " + all.unseen + " terms not started, aim for " + newPerDay(CARDS) + " new a day.";

  const unitChips = [1, 2, 3, 4].map(u =>
    '<button class="chip' + (FILTER.has(u) ? " on" : "") + '" data-act="unit" data-u="' + u + '" aria-pressed="' + FILTER.has(u) + '">Unit ' + u + "</button>").join("");

  const modes = [
    ["flip", "Flip and write", "Type what you remember, flip, then rate yourself. Spaced repetition decides what returns."],
    ["mc", "Identify", "Read a definition, example or importance line, pick the term it belongs to."],
    ["tags", "SPICE-T and Process", "Pick the right SPICE-T categories and Key Processes for each term."],
    ["mockSetup", "Mock test", "Test format: a blank, then the description. Fill each blank from a word bank, then get graded."],
    ["lightning", "Lightning round", "60 seconds, multiple choice, streaks multiply your score. Best: " + S.bestLightning],
  ].map(m => '<button class="mode" data-act="mode" data-m="' + m[0] + '"><b>' + m[1] + "</b><span>" + esc(m[2]) + "</span></button>").join("");

  const tiles = [1, 2, 3, 4].map(u => {
    const cs = CARDS.filter(c => c.unit === u), solid = cs.filter(c => tier(c.id) >= 2).length;
    return '<div style="opacity:' + (FILTER.has(u) ? 1 : .45) + '"><div class="unit-head"><h3>Unit ' + u + " · " + UNITS[u].name +
      '</h3><span class="label">' + UNITS[u].yrs + " · " + solid + "/" + cs.length + " solid</span></div>" +
      '<div class="tiles">' + cs.map(c => '<button class="tile t' + tier(c.id) + (isDue(c.id) ? " due" : "") +
        '" data-act="open" data-id="' + c.id + '">' + esc(c.term) + "</button>").join("") + "</div></div>";
  }).join("");

  const html = '<div class="top"><div class="brand">Vocab Conquest<small>AP World History · Units 1–4</small></div>' +
    '<div class="sync" id="syncBadge"></div></div>' +

    '<div class="panel rank"><div><span class="label">Rank</span><h2>' + r.name + "</h2></div>" +
      '<div class="stat"><b>' + sk + '</b><div class="label">day streak</div></div>' +
      '<div style="grid-column:1/-1"><div class="bar" aria-hidden="true"><i style="width:' + Math.round(r.pct * 100) + '%"></i></div>' +
      '<div class="label" style="margin-top:6px">' + S.xp + " XP" + (r.next ? " · " + r.toNext + " to " + r.next : " · top rank") + "</div></div></div>" +

    '<button class="btn primary cta" data-act="smart"' + (queue.length ? "" : " disabled") + "><b>" +
      (queue.length ? "Start today's session" : "Nothing due right now") + "</b><span>" +
      (queue.length ? queue.length + " cards · " + st.due + " due · " + newN + " new" : "Pick a mode below to keep drilling.") + "</span></button>" +

    '<div class="panel plan row spread"><span class="grow" style="min-width:200px">' + esc(planText) + "</span>" +
      '<label class="row"><span class="label">Test date</span><input type="date" id="testDate" value="' + esc(S.testDate) + '"></label></div>' +

    '<div class="row"><span class="label">Study from</span>' + unitChips + "</div>" +
    '<div class="modes">' + modes + "</div>" +

    '<div class="panel"><div class="row spread"><h2 style="font-size:20px">Territory map</h2><span class="label">' + all.t[3] + " of " + all.total + " mastered</span></div>" +
      '<div class="bar gold" style="margin:10px 0 12px" aria-hidden="true"><i style="width:' + Math.round(all.t[3] / all.total * 100) + '%"></i></div>' +
      '<div class="legend"><span><i style="background:var(--t0)"></i>Not started</span><span><i style="background:var(--t1)"></i>Learning</span>' +
      '<span><i style="background:var(--t2)"></i>Familiar</span><span><i style="background:var(--t3)"></i>Mastered</span>' +
      '<span><i style="background:var(--bad);border-radius:50%"></i>Due for review</span></div>' +

      '<p class="muted" style="font-size:13.5px;margin:12px 0 0">Tap any tile to read the card. A term counts as mastered after you have recalled it correctly several times across days.</p></div>' +

    '<details class="panel backup"><summary>Backup and reset</summary><div class="list" style="margin-top:12px">' +
      '<p class="muted" style="margin:0;font-size:14px">Progress saves automatically. To move it to another browser, copy the code below and paste it there.</p>' +
      '<textarea id="exportBox" readonly aria-label="Progress code"></textarea>' +
      '<div class="row"><button class="btn small" data-act="export">Show and copy my code</button></div>' +
      '<textarea id="importBox" class="short" placeholder="Paste a progress code here" aria-label="Paste progress code"></textarea>' +
      '<div class="row"><button class="btn small" data-act="import">Load this code</button>' +
      '<button class="btn small ghost" data-act="reset" id="resetBtn">Reset all progress</button></div></div></details>';

  return { html, dock: "" };

/* ---- Card detail sheet ---------------------------------------------------- */
function renderSheet() {
  const el = $("modal");
  if (!sheetId) { el.innerHTML = ""; return; }
  const c = BYID[sheetId], cs = getC(c.id), T = ["Not started", "Learning", "Familiar", "Mastered"][tier(c.id)];
  el.innerHTML = '<div class="overlay" data-act="closeSheet" data-backdrop="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(c.term) + '">' +
    '<div class="row spread"><span class="label">Unit ' + c.unit + " · " + T + (cs.seen ? " · " + cs.ok + " right, " + cs.bad + " missed" : "") + "</span>" +
    '<button class="btn small ghost" data-act="closeSheet">Close</button></div>' +
    '<div class="term">' + esc(c.term) + "</div>" + cardBack(c) +
    '<button class="btn primary block" data-act="studyOne" data-id="' + c.id + '">Study just this card</button></div></div>';
}

/* ---- Shared click and key handling ---------------------------------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.backdrop && e.target !== t) return;          // clicks inside the sheet do not close it
  const f = ACT[t.dataset.act];
  if (f) f(t.dataset, t, e);
});
document.addEventListener("change", e => {
  if (e.target.id === "testDate") { S.testDate = e.target.value || ""; save(); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetId) { sheetId = null; renderSheet(); return; }
  if (e.metaKey || e.altKey) return;
  const typing = /^(TEXTAREA|INPUT)$/.test(e.target.tagName);
  const f = KEYS[view];
  if (f) f(e, typing);
});

ACT.unit = d => {
  const u = +d.u;
  if (FILTER.has(u)) { if (FILTER.size > 1) FILTER.delete(u); } else FILTER.add(u);
  render();
};
ACT.open = d => { sheetId = d.id; renderSheet(); };
ACT.closeSheet = () => { sheetId = null; renderSheet(); };
ACT.export = () => {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const box = $("exportBox"); box.value = code; box.select();
  try { navigator.clipboard.writeText(code).then(() => toast("Code copied"), () => toast("Select the code and copy it")); }
  catch (err) { toast("Select the code and copy it"); }
};
ACT.import = () => {
  const raw = $("importBox").value.trim();
  try { adopt(JSON.parse(decodeURIComponent(escape(atob(raw))))); save(); render(); toast("Progress loaded"); }
  catch (err) { toast("That code did not work. Copy it again in full."); }
};
ACT.reset = (d, el) => {
  if (!el.dataset.sure) { el.dataset.sure = "1"; el.textContent = "Tap again to erase everything"; return; }
  S = freshState(); save(); render(); toast("Progress reset");
};

/* ==========================================================================
   PART 3A — STUDY SESSIONS: starting, flip cards, multiple choice, lightning
   A session is a plain object kept in SES:
     { mode, queue:[card ids], i:index, missed:[ids], xp0:XP at start, rank0:rank at start, ... }
   ========================================================================== */

function startSession(mode, ids, extra) {
  SES = Object.assign({ mode, queue: ids.slice(), i: 0, ok: 0, bad: 0, missed: [], xp0: S.xp, rank0: rankInfo().i, retries: {} }, extra || {});
  S.sessions++;
  view = mode;
  if (mode === "flip") Object.assign(SES, { revealed: false, answer: "" });
  if (mode === "mc") { SES.picked = null; makeQuestion(); }
  if (mode === "tags") Object.assign(SES, { sel: { spice: new Set(), proc: new Set() }, checked: false, hint: false });
  render(); window.scrollTo(0, 0);
}
/* Free drill order: weakest cards first, ties shuffled. */
function drillQueue(n) {
  return shuffle(poolOf(FILTER)).sort((a, b) => tier(a.id) - tier(b.id)).slice(0, n).map(c => c.id);
}
function currentId() { return SES.queue[SES.i]; }

function studyTop() {
  const done = SES.timed ? "" : Math.min(SES.i + 1, SES.queue.length) + "/" + SES.queue.length;
  const pct = SES.timed ? 0 : Math.round(SES.i / SES.queue.length * 100);
  return '<div class="study-top"><button class="btn small ghost" data-act="end">End</button>' +
    (SES.timed ? '<div class="bar"><i id="timerBar" style="width:100%"></i></div>'
               : '<div class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div>') +
    '<span class="label">' + (SES.timed ? '<span id="timer">60</span>s' : done) + "</span></div>";
}
function advance() {
  SES.i++;
  if (SES.timed && SES.i >= SES.queue.length) SES.queue = SES.queue.concat(shuffle(poolOf(FILTER)).map(c => c.id));
  if (SES.i >= SES.queue.length) { finishSession(); return false; }
  return true;
}
function finishSession() {
  if (SES.tick) { clearInterval(SES.tick); SES.tick = null; }
  if (SES.mode === "mock") { view = "mockDone"; render(); window.scrollTo(0, 0); return; }
  view = "summary"; render(); window.scrollTo(0, 0);
}

ACT.smart = () => { const q = buildQueue(poolOf(FILTER), 20); if (q.length) startSession("flip", q); };
ACT.mode = d => {
  const m = d.m;
  if (m === "mockSetup") { go("mockSetup"); return; }
  if (m === "lightning") {
    const ids = shuffle(poolOf(FILTER)).map(c => c.id);
    startSession("mc", ids, { timed: true, deadline: Date.now() + 60000, score: 0, combo: 0, best: 0 }); return;
  }
  startSession(m, drillQueue(20));
};
ACT.studyOne = d => { sheetId = null; startSession("flip", [d.id]); };
ACT.home = () => { view = "home"; SES = null; render(); window.scrollTo(0, 0); };
ACT.end = () => {
  if (SES && SES.tick) {
    clearInterval(SES.tick); SES.tick = null;
    if (SES.timed) { S.bestLightning = Math.max(S.bestLightning, SES.score); addXP(Math.round(SES.score / 4)); save(); }
  }
  if (SES && SES.mode !== "mock" && (SES.ok + SES.bad) > 0) finishSession(); else ACT.home();
};

/* ---- Flip and write ------------------------------------------------------- */
function flipView() {
  const c = BYID[currentId()];
  if (!SES.revealed) {
    return {
      html: '<div class="wrap">' + studyTop() + '<div class="card"><span class="label">Unit ' + c.unit + " · " + UNITS[c.unit].name + "</span>" +
        '<div class="term">' + esc(c.term) + "</div>" +
        '<div class="sect"><label class="label" for="ans">Write what you remember (optional, but it works much better)</label>' +
        '<textarea id="ans" placeholder="Definition, example, SPICE-T, why it matters..."></textarea></div></div></div>',
      dock: '<button class="btn primary" data-act="reveal">Reveal answer<small>Enter</small></button>',
      after: () => { const a = $("ans"); if (a) a.focus({ preventScroll: true }); },
    };
  }
  const labels = ["Again", "Hard", "Good", "Easy"];
  const dock = labels.map((l, q) => '<button class="btn r' + q + '" data-act="rate" data-q="' + q + '">' + l +
    "<small>" + (q + 1) + " · " + waitLabel(nextState(getC(c.id), q).wait) + "</small></button>").join("");
  return {
    html: '<div class="wrap">' + studyTop() + '<div class="card"><span class="label">Unit ' + c.unit + "</span>" +
      '<div class="term">' + esc(c.term) + "</div>" +
      (SES.answer.trim() ? '<div class="sect"><span class="label">What you wrote</span><div class="yours">' + esc(SES.answer) + "</div></div>" : "") +
      cardBack(c) + "</div></div>",
    dock,
  };
}
ACT.reveal = () => {
  if (view !== "flip" || SES.revealed) return;
  const a = $("ans"); SES.answer = a ? a.value : "";
  SES.revealed = true; render(); window.scrollTo(0, 0);
};
ACT.rate = d => {
  const q = +d.q, id = currentId();
  grade(id, q, { xp: [0, 4, 8, 12][q] });
  if (q === 0) {
    SES.bad++; if (!SES.missed.includes(id)) SES.missed.push(id);
    SES.retries[id] = (SES.retries[id] || 0) + 1;
    if (SES.retries[id] <= 2) SES.queue.splice(Math.min(SES.i + 5, SES.queue.length), 0, id);   // see it again shortly
  } else SES.ok++;
  SES.revealed = false; SES.answer = "";
  if (advance()) { render(); window.scrollTo(0, 0); }
};
KEYS.flip = (e, typing) => {
  if (!SES.revealed) {
    if ((typing && e.key === "Enter" && !e.shiftKey) || (!typing && (e.key === "Enter" || e.key === " "))) { e.preventDefault(); ACT.reveal(); }
  } else if (!typing && /^[1-4]$/.test(e.key)) { e.preventDefault(); ACT.rate({ q: +e.key - 1 }); }
};

/* ---- Identify (multiple choice) and Lightning ------------------------------ */
const GENERIC = new Set(["trade", "system", "society", "empire", "exchange", "communities", "community", "dynasty", "travelers", "technology",
  "rule", "state", "building", "authority", "challenges", "european", "road", "west", "east", "africa", "colonial", "labor", "slavery",
  "ocean", "indian", "trading", "companies", "company", "cultural", "diffusion", "goods", "luxury", "animals", "dying", "great", "middle"]);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
/* Hide the term (and its distinctive words) so a clue does not give itself away. */
function mask(text, term) {
  const BLOCK = "▢▢▢";
  const words = term.replace(/[():\/,]/g, " ").split(/\s+/).filter(w => w.length >= 4 && !GENERIC.has(w.toLowerCase()));
  let out = text.replace(new RegExp(escRe(term.replace(/\s*\(.*\)/, "")) + "(?:s|es)?", "gi"), BLOCK);
  words.forEach(w => {
    const stem = w.length >= 6 ? w.slice(0, w.length - 1) : w;
    out = out.replace(new RegExp("\\b" + escRe(stem) + "\\w*", "gi"), BLOCK);
  });
  return out;
}
function distractors(c, n) {
  const stem = w => w.toLowerCase().replace(/[^a-z]/g, "").slice(0, 5);
  const mine = new Set(c.term.split(/\s+/).filter(w => w.length > 3).map(stem));
  const cand = CARDS.filter(x => x.id !== c.id && !x.term.split(/\s+/).some(w => w.length > 3 && mine.has(stem(w))));
  const same = shuffle(cand.filter(x => x.unit === c.unit)), other = shuffle(cand.filter(x => x.unit !== c.unit));
  return same.slice(0, n - 1).concat(other).slice(0, n).map(x => x.id);
}
const Q_TYPES = [
  ["definition", "Which term is defined this way?"],
  ["example", "Which term does this example illustrate?"],
  ["why", "Which term does this explain the importance of?"],
];
function makeQuestion() {
  // Descriptions are what the real test shows, so definitions come up most often.
  const c = BYID[currentId()], t = Math.random() < 0.6 ? Q_TYPES[0] : Q_TYPES[1 + Math.floor(Math.random() * 2)];
  SES.picked = null;
  SES.q = { prompt: t[1], text: mask(c[t[0]], c.term), opts: shuffle([c.id].concat(distractors(c, 3))) };
}
function mcView() {
  const c = BYID[currentId()], q = SES.q, done = SES.picked != null;
  const opts = q.opts.map((id, k) => {
    let cls = "";
    if (done) cls = id === c.id ? " right" : id === SES.picked ? " wrong" : "";
    return '<button class="opt' + cls + '" data-act="pick" data-id="' + id + '"' + (done ? " disabled" : "") + '><span class="k">' + (k + 1) + "</span><span>" + esc(BYID[id].term) + "</span></button>";
  }).join("");
  const hud = SES.timed ? '<div class="row spread"><span class="combo">' + SES.score + ' pts</span><span class="label">Streak ' + SES.combo + " · x" + comboMult() + "</span></div>" : "";
  const feedback = done && !SES.timed
    ? '<div class="card"><div class="row"><span class="label">' + (SES.picked === c.id ? "Correct" : "The answer was") + '</span></div><div class="term" style="font-size:26px">' + esc(c.term) + "</div>" + cardBack(c) + "</div>" : "";
  return {
    html: '<div class="wrap">' + studyTop() + hud + '<div class="card"><span class="label">' + q.prompt + '</span><div class="q">' + esc(q.text) + "</div></div>" +
      '<div class="opts">' + opts + "</div>" + feedback + "</div>",
    dock: done && !SES.timed ? '<button class="btn primary" data-act="next">Next<small>Enter</small></button>' : "",
    after: SES.timed ? startTimer : null,
  };
}
const comboMult = () => 1 + Math.min(4, Math.floor(SES.combo / 3));
ACT.pick = d => {
  if (SES.picked != null) return;
  const c = BYID[currentId()], right = d.id === c.id;
  SES.picked = d.id;
  if (right) {
    SES.ok++;
    if (SES.timed) { SES.score += 10 * comboMult(); SES.combo++; SES.best = Math.max(SES.best, SES.combo); }
    grade(c.id, 1, { cap: 2, xp: SES.timed ? 0 : 5 });        // recognition only lifts a card to box 2
  } else {
    SES.bad++; if (!SES.missed.includes(c.id)) SES.missed.push(c.id);
    if (SES.timed) SES.combo = 0;
    grade(c.id, 0);
  }
  render();
  if (SES.timed) setTimeout(() => { if (SES && SES.timed && view === "mc" && SES.picked != null) ACT.next(); }, right ? 450 : 1100);
};
ACT.next = () => {
  if (SES.picked == null) return;
  if (advance()) { makeQuestion(); render(); window.scrollTo(0, 0); }
};
KEYS.mc = (e, typing) => {
  if (typing) return;
  if (SES.picked == null && /^[1-4]$/.test(e.key)) { const id = SES.q.opts[+e.key - 1]; if (id) { e.preventDefault(); ACT.pick({ id }); } }
  else if (SES.picked != null && !SES.timed && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ACT.next(); }
};
function startTimer() {
  if (SES.tick) return;
  const upd = () => {
    const left = Math.max(0, SES.deadline - Date.now());
    const t = $("timer"), b = $("timerBar");
    if (t) t.textContent = Math.ceil(left / 1000);
    if (b) b.style.width = (left / 600) + "%";
    if (left <= 0) {
      clearInterval(SES.tick); SES.tick = null;
      S.bestLightning = Math.max(S.bestLightning, SES.score);
      addXP(Math.round(SES.score / 4)); save();
      finishSession();
    }
  };
  SES.tick = setInterval(upd, 200); upd();
}

/* ---- Session summary -------------------------------------------------------- */
function summaryView() {
  const s = SES, total = s.ok + s.bad, acc = total ? Math.round(s.ok / total * 100) : 0;
  const rankNow = rankInfo(), up = rankNow.i > s.rank0;
  const gained = S.xp - s.xp0;
  const missed = s.missed.map(id => '<div class="item"><span>' + esc(BYID[id].term) + '</span><button class="btn small" data-act="open" data-id="' + id + '">Review</button></div>').join("");
  const headline = s.timed ? s.score + " points" : acc + "% correct";
  return {
    html: '<div class="wrap"><div class="panel"><span class="label">' + (s.timed ? "Lightning round" : "Session complete") + '</span><div class="big" style="margin:6px 0">' + headline + "</div>" +
      '<div class="muted">' + total + " answered · " + s.ok + " right · " + s.bad + " missed · +" + gained + " XP" +
      (s.timed ? " · best streak " + s.best + (s.score >= S.bestLightning && s.score > 0 ? " · new personal best" : "") : "") + "</div>" +
      (up ? '<div class="note" style="margin-top:12px">Promoted to ' + rankNow.name + ".</div>" : "") + "</div>" +
      (missed ? '<div class="panel"><h2 style="font-size:18px;margin-bottom:10px">Missed this session</h2><div class="list">' + missed + "</div></div>" : "") + "</div>",
    dock: (s.missed.length ? '<button class="btn" data-act="studyMissed">Study the missed</button>' : "") + '<button class="btn primary" data-act="home">Back to map</button>',
  };
}
ACT.studyMissed = () => startSession("flip", SES.missed);

/* ==========================================================================
   PART 3B — SPICE-T / PROCESS DRILL AND THE MOCK TEST
   Both use the same chip pickers and the same partial-credit scoring:
   each right pick earns a share of the point, each wrong pick takes one away.
   ========================================================================== */

function scoreSet(sel, target) {
  let hits = 0, wrongs = 0;
  sel.forEach(x => { if (target.has(x)) hits++; else wrongs++; });
  return { hits, wrongs, pts: Math.max(0, (hits - wrongs) / target.size) };
}
/* One group of toggle chips. After checking, chips show right / wrong / missed. */
function chipGroup(g, items, sel, target, checked) {
  return '<div class="chips">' + items.map((it, k) => {
    const on = sel.has(it);
    let cls = on ? " on" : "";
    if (checked) cls = on ? (target.has(it) ? " right" : " wrong") : (target.has(it) ? " miss" : "");
    const label = g === "proc" ? '<span class="n">' + (PROCESSES.indexOf(it) + 1) + "</span>" + esc(it) : esc(labelSpice(it));
    return '<button class="chip' + cls + '" data-act="tog" data-g="' + g + '" data-v="' + esc(it) + '" aria-pressed="' + on + '"' + (checked ? " disabled" : "") + ">" + label + "</button>";
  }).join("") + "</div>";
}
function tagsTarget(c) { return { spice: new Set(c.spice), proc: new Set(c.process) }; }

/* ---- SPICE-T and Process drill ---------------------------------------------- */
function tagsView() {
  const c = BYID[currentId()], s = SES, T = tagsTarget(c);
  let result = "";
  if (s.checked) {
    const a = scoreSet(s.sel.spice, T.spice), b = scoreSet(s.sel.proc, T.proc);
    result = '<div class="panel row spread"><span><b>SPICE-T</b> ' + Math.round(a.pts * 100) + "% · <b>Process</b> " + Math.round(b.pts * 100) + "%</span>" +
      '<span class="label">Green = right · dashed = you missed it · red = not on this card</span></div>' +
      '<details class="panel"><summary>Show the full card</summary><div class="list" style="margin-top:12px">' + cardBack(c) + "</div></details>";
  }
  return {
    html: '<div class="wrap">' + studyTop() + '<div class="card"><span class="label">Unit ' + c.unit + " · tag this term</span>" +
      '<div class="term">' + esc(c.term) + "</div>" +
      (s.hint ? '<div class="sect"><span class="label">Definition</span><p>' + esc(c.definition) + "</p></div>"
              : '<div><button class="btn small" data-act="hint">Show the definition</button></div>') +
      '<div class="sect"><span class="label">SPICE-T (pick all that apply)</span>' + chipGroup("spice", SPICE, s.sel.spice, T.spice, s.checked) + "</div>" +
      '<div class="sect"><span class="label">Process (usually one or two)</span>' + chipGroup("proc", PROCESSES, s.sel.proc, T.proc, s.checked) + "</div></div>" + result + "</div>",
    dock: s.checked ? '<button class="btn primary" data-act="tagNext">Next<small>Enter</small></button>'
                    : '<button class="btn primary" data-act="tagCheck"' + (s.sel.spice.size || s.sel.proc.size ? "" : " disabled") + ">Check<small>Enter</small></button>",
  };
}
ACT.hint = () => { SES.hint = true; render(); };
ACT.tog = d => {
  if (SES.checked) return;
  const set = SES.sel[d.g];
  if (set.has(d.v)) set.delete(d.v); else set.add(d.v);
  render();
};
ACT.tagCheck = () => {
  if (SES.checked || !(SES.sel.spice.size || SES.sel.proc.size)) return;
  const c = BYID[currentId()], T = tagsTarget(c);
  const a = scoreSet(SES.sel.spice, T.spice), b = scoreSet(SES.sel.proc, T.proc), avg = (a.pts + b.pts) / 2;
  const q = avg === 1 ? 2 : avg >= 0.5 ? 1 : 0;
  grade(c.id, q, { cap: 3, xp: Math.round(avg * 6) });
  const cs = mut(c.id); cs.tt += 2; cs.tg += a.pts + b.pts; save();
  if (avg === 1) SES.ok++; else { SES.bad++; if (!SES.missed.includes(c.id)) SES.missed.push(c.id); }
  SES.checked = true; render();
};
ACT.tagNext = () => {
  if (!SES.checked) return;
  SES.sel = { spice: new Set(), proc: new Set() }; SES.checked = false; SES.hint = false;
  if (advance()) { render(); window.scrollTo(0, 0); }
};
KEYS.tags = (e, typing) => {
  if (typing || e.key !== "Enter") return;
  e.preventDefault(); if (SES.checked) ACT.tagNext(); else ACT.tagCheck();
};

/* ==========================================================================
   PART 3C — MOCK TEST (fill-in-the-blank with a word bank)
   Matches how the real test is formatted: each item is a blank followed by a
   description, and the bank holds exactly the terms being tested. Pick a term
   for every blank (each term is used once), then grade the whole test at once.
   ========================================================================== */

const MOCK = { size: 30, clue: "def" };       // clue: def = definition | defex = definition + example | mixed
const CLUE_LABELS = { def: "Definition", defex: "Definition and example", mixed: "Mixed clues" };

function buildClue(id) {
  const c = BYID[id];
  if (MOCK.clue === "defex") return mask(c.definition, c.term) + " " + mask(c.example, c.term);
  if (MOCK.clue === "mixed") { const f = ["definition", "example", "why"][Math.floor(Math.random() * 3)]; return mask(c[f], c.term); }
  return mask(c.definition, c.term);
}

function mockSetupView() {
  const n = poolOf(FILTER).length;
  const chips = (arr, on, act, key) => arr.map(a => '<button class="chip' + (on(a[0]) ? " on" : "") + '" data-act="' + act + '" data-' + key + '="' + a[0] + '" aria-pressed="' + on(a[0]) + '">' + a[1] + "</button>").join("");
  const sizes = chips([[25, "25 terms"], [30, "30 terms"], [40, "40 terms"], [94, "All 94"]], k => MOCK.size === k, "mockSize", "n");
  const clues = chips(Object.entries(CLUE_LABELS), k => MOCK.clue === k, "mockClue", "c");
  const units = chips([1, 2, 3, 4].map(u => [u, "Unit " + u]), u => FILTER.has(u), "unit", "u");
  return {
    html: '<div class="wrap"><div class="top"><div class="brand">Mock test</div><button class="btn small ghost" data-act="home">Back</button></div>' +
      '<div class="panel list"><p style="margin:0">Each question is a blank followed by a description. Choose the term from the word bank. Every term is used once, like the real test.</p>' +
      '<div><span class="label">How many terms</span><div class="sizes" style="margin-top:8px">' + sizes + "</div></div>" +
      '<div><span class="label">What the description shows</span><div class="sizes" style="margin-top:8px">' + clues + "</div></div>" +
      '<div><span class="label">Units in the bank</span><div class="sizes" style="margin-top:8px">' + units + "</div></div>" +
      '<p class="muted" style="margin:0;font-size:14px">' + Math.min(MOCK.size, n) + " of " + n + " terms will be drawn at random.</p></div></div>",
    dock: '<button class="btn primary" data-act="mockStart">Start the test</button>',
  };
}
ACT.mockSize = d => { MOCK.size = +d.n; render(); };
ACT.mockClue = d => { MOCK.clue = d.c; render(); };
ACT.mockStart = () => {
  const ids = shuffle(poolOf(FILTER)).slice(0, MOCK.size).map(c => c.id);
  startSession("mock", ids, { items: ids.map(id => ({ id, clue: buildClue(id), pick: null })), t0: Date.now() });
};

const byTerm = (a, b) => BYID[a].term.localeCompare(BYID[b].term);
function bankIds() { return SES.items.map(it => it.id).sort(byTerm); }
function usedPicks() { return new Set(SES.items.map(it => it.pick).filter(Boolean)); }
function bankHtml() {
  const used = usedPicks();
  return '<div class="chips">' + bankIds().map(id => '<span class="chip static" style="' + (used.has(id) ? "opacity:.4;text-decoration:line-through" : "") + '">' + esc(BYID[id].term) + "</span>").join("") + "</div>";
}
function mockDockHtml() {
  const n = SES.items.filter(it => it.pick).length;
  return '<button class="btn primary" data-act="mockGrade">Grade my test<small>' + n + " of " + SES.items.length + " answered</small></button>";
}

function mockView() {
  const bank = bankIds();
  const items = SES.items.map((it, i) => {
    const opts = '<option value="">choose a term</option>' + bank.map(id => '<option value="' + id + '"' + (it.pick === id ? " selected" : "") + ">" + esc(BYID[id].term) + "</option>").join("");
    return '<div class="card" style="gap:8px"><div class="row" style="flex-wrap:nowrap"><span class="label">' + (i + 1) + '</span>' +
      '<select class="blank-sel" id="sel_' + i + '" data-sel="' + i + '" aria-label="Answer for question ' + (i + 1) + '">' + opts + "</select></div>" +
      '<p class="q" style="margin:0;font-size:16px">' + esc(it.clue) + "</p></div>";
  }).join("");
  return {
    html: '<div class="wrap"><div class="row spread"><button class="btn small ghost" data-act="end">End</button><span class="label">Mock test · ' + SES.items.length + " terms</span></div>" +
      '<div class="panel"><span class="label">Word bank</span><div id="bank" style="margin-top:8px">' + bankHtml() + "</div></div>" + items + "</div>",
    dock: mockDockHtml(),
    after: refreshMock,
  };
}
/* Update the dropdowns and bank in place so the page does not jump while you answer. */
function refreshMock() {
  const used = usedPicks();
  SES.items.forEach((it, i) => {
    const sel = $("sel_" + i); if (!sel) return;
    [...sel.options].forEach(o => { o.disabled = !!o.value && used.has(o.value) && o.value !== it.pick; });
  });
  const b = $("bank"); if (b) b.innerHTML = bankHtml();
  if (view === "mock") $("dock").innerHTML = '<div class="dock"><div class="dock-in">' + mockDockHtml() + "</div></div>";
}
document.addEventListener("change", e => {
  const t = e.target;
  if (view !== "mock" || !t.dataset || t.dataset.sel == null) return;
  SES.items[+t.dataset.sel].pick = t.value || null;
  refreshMock();
});

ACT.mockGrade = () => {
  const s = SES; let right = 0;
  s.items.forEach(it => {
    const ok = it.pick === it.id; it.ok = ok;
    grade(it.id, ok ? 2 : 0, { cap: 3, xp: ok ? 4 : 0 });
    if (ok) { s.ok++; right++; } else { s.bad++; s.missed.push(it.id); }
  });
  s.right = right; s.mins = Math.max(1, Math.round((Date.now() - s.t0) / 60000));
  finishSession();
};

function mockDoneView() {
  const s = SES, n = s.items.length, pct = Math.round(s.right / n * 100);
  const verdict = pct >= 95 ? "You are ready. Do one short session in the morning and stop." : pct >= 85 ? "Almost there. Drill the misses below, then take another bank." : "Keep going. The misses below are where the points are.";
  const wrong = s.items.filter(it => !it.ok), rightOnes = s.items.filter(it => it.ok);
  const row = (it, bad) => '<div class="card" style="gap:6px"><div class="row spread"><b>' + esc(BYID[it.id].term) + "</b>" +
    '<button class="btn small" data-act="open" data-id="' + it.id + '">Full card</button></div>' +
    (bad ? '<span style="color:var(--bad);font-size:14px">' + (it.pick ? "You chose " + esc(BYID[it.pick].term) : "Left blank") + "</span>" : "") +
    '<p class="muted" style="margin:0;font-size:14px">' + esc(it.clue) + "</p></div>";
  return {
    html: '<div class="wrap"><div class="panel"><span class="label">Mock test complete</span><div class="big" style="margin:6px 0">' + pct + "%</div>" +
      '<div class="muted">' + s.right + " of " + n + " correct · about " + s.mins + " min</div><p style=\"margin:12px 0 0\">" + verdict + "</p></div>" +
      (wrong.length ? '<h2 style="font-size:18px">Missed (' + wrong.length + ")</h2>" + wrong.map(it => row(it, true)).join("") : "") +
      (rightOnes.length ? '<details class="panel"><summary>Correct (' + rightOnes.length + ")</summary><div class=\"list\" style=\"margin-top:12px\">" + rightOnes.map(it => '<div class="item"><span>' + esc(BYID[it.id].term) + "</span></div>").join("") + "</div></details>" : "") + "</div>",
    dock: (s.missed.length ? '<button class="btn" data-act="studyMissed">Drill the misses</button>' : "") +
          '<button class="btn" data-act="mockAgain">New test</button><button class="btn primary" data-act="home">Back to map</button>',
  };
}
ACT.mockAgain = () => { go("mockSetup"); };

/* ==========================================================================
   PART 4 — SAVING TO YOUR ACCOUNT, THEN START
   Progress is always written to this browser first (instant, works offline).
   When the page has a private per-user database, it is also copied there, so
   progress survives a cleared browser and follows you between devices.
   ========================================================================== */

let DB = null, UID = null, dirty = false, syncing = false, syncTimer = null;
const stateDoc = () => DB.doc("data/users/" + UID + "/state");

function queueSync() {                           // called by save(); batches rapid saves
  if (!DB || !UID) return;
  dirty = true; clearTimeout(syncTimer); syncTimer = setTimeout(pushDb, 1500);
}
async function pushDb() {
  if (!DB || !dirty) return;
  if (syncing) { syncTimer = setTimeout(pushDb, 800); return; }   // one write at a time
  syncing = true; dirty = false;
  try { await stateDoc().set({ json: JSON.stringify(S), u: S.u }); syncState = "cloud"; }
  catch (e) { syncState = "local"; }
  syncing = false; updateSyncBadge();
}
async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    DB = db; UID = id;
    const snap = await stateDoc().get();
    if (snap.exists) {
      const d = snap.data() || {};
      if ((+d.u || 0) > S.u) { adopt(JSON.parse(d.json)); saveLocal(); if (view === "home") render(); }   // the account copy is newer
      else if ((+d.u || 0) < S.u) queueSync();                                                              // this browser is newer
    } else if (S.u) queueSync();
    syncState = "cloud"; updateSyncBadge();
  } catch (e) { syncState = "local"; updateSyncBadge(); }
}

loadLocal();
render();
initCloud();

</script>
