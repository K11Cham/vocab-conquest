<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one focused column. Home is a dashboard (rank, plan, modes, territory map);
   every study mode takes over the screen with a bottom dock for its actions. */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface2:#f4f6fa; --ink:#121722; --muted:#586174; --line:#d6dbe6;
  --accent:#2547c9; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#17804f; --good-soft:#d9f1e4; --warn:#9a5806; --warn-soft:#f9e9cc; --bad:#b8352e; --bad-soft:#fbe0dd;
  --t0:#e2e6ee; --t0-ink:#3a4255; --t1:#f6e3b4; --t1-ink:#3d2a05; --t2:#bfe3cf; --t2-ink:#0f3d27; --t3:#e9bb4e; --t3-ink:#2e1f02;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1220; --surface:#151c2e; --surface2:#1b2338; --ink:#e8ecf6; --muted:#9aa5bc; --line:#2a3350;
    --accent:#86a0ff; --accent-ink:#0d1220; --accent-soft:#1f2a52;
    --good:#5fd29a; --good-soft:#14382a; --warn:#f0b95a; --warn-soft:#3a2c10; --bad:#ff8f86; --bad-soft:#3d1b19;
    --t0:#232c45; --t0-ink:#aab4cb; --t1:#54431c; --t1-ink:#f6e7c4; --t2:#1b5a3d; --t2-ink:#d6f5e5; --t3:#dcae3d; --t3-ink:#1b1406;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#151c2e; --surface2:#1b2338; --ink:#e8ecf6; --muted:#9aa5bc; --line:#2a3350;
  --accent:#86a0ff; --accent-ink:#0d1220; --accent-soft:#1f2a52;
  --good:#5fd29a; --good-soft:#14382a; --warn:#f0b95a; --warn-soft:#3a2c10; --bad:#ff8f86; --bad-soft:#3d1b19;
  --t0:#232c45; --t0-ink:#aab4cb; --t1:#54431c; --t1-ink:#f6e7c4; --t2:#1b5a3d; --t2-ink:#d6f5e5; --t3:#dcae3d; --t3-ink:#1b1406;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.has-dock{padding-bottom:150px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--font-mono)}
.label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.spread{justify-content:space-between}
.grow{flex:1 1 0;min-width:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sync{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:right}

/* buttons and chips */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:10px 14px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px;text-align:left;line-height:1.25}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-right:6px}
.chip.right{background:var(--good-soft);border-color:var(--good);font-weight:600}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through}
.chip.miss{border:2px dashed var(--good);background:transparent}
.chip.static{cursor:default;min-height:0;padding:3px 10px;font-size:13px;background:var(--surface2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* rank + plan */
.rank{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:end}
.rank h2{font-size:28px;line-height:1.1}
.bar{height:8px;background:var(--t0);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.gold>i{background:var(--t3)}
.stat{text-align:right}
.stat b{font-family:var(--font-display);font-size:26px;line-height:1}
.plan input[type=date]{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
.cta{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:16px}
.cta b{font-family:var(--font-display);font-size:20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.mode{text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--font-display);font-size:17px}
.mode span{font-size:13.5px;color:var(--muted);line-height:1.35}

/* territory map */
.unit-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 8px;flex-wrap:wrap}
.unit-head h3{font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.tile{position:relative;border:0;border-radius:8px;padding:8px 8px 9px;min-height:62px;text-align:left;font-size:12.5px;line-height:1.2;font-weight:500;overflow-wrap:anywhere}
.tile.t0{background:var(--t0);color:var(--t0-ink)} .tile.t1{background:var(--t1);color:var(--t1-ink)}
.tile.t2{background:var(--t2);color:var(--t2-ink)} .tile.t3{background:var(--t3);color:var(--t3-ink);font-weight:600}
.tile.due::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* study screens */
.study-top{display:flex;align-items:center;gap:12px}
.study-top .bar{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.term{font-family:var(--font-display);font-size:clamp(28px,7vw,40px);line-height:1.08;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.sect{display:flex;flex-direction:column;gap:4px}
.sect p{margin:0;max-width:68ch}
.note{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:14px}
textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:96px;resize:vertical}
textarea.short{min-height:72px}
.yours{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-height:48px}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.q{font-size:18px;line-height:1.5;max-width:62ch}
.blank{letter-spacing:.1em;color:var(--muted)}
.mark{display:flex;gap:8px}
.mark .btn.sel-y{background:var(--good-soft);border-color:var(--good)}
.mark .btn.sel-n{background:var(--bad-soft);border-color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.2}
.dock .btn small{font-family:var(--font-mono);font-size:11px;font-weight:400;color:inherit;opacity:.75}
.r0{border-color:var(--bad)!important} .r1{border-color:var(--warn)!important} .r2{border-color:var(--good)!important} .r3{border-color:var(--accent)!important}
.combo{font-family:var(--font-display);font-weight:700;font-size:20px}
.big{font-family:var(--font-display);font-size:48px;line-height:1;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:8px;min-width:0}
.item span:first-child{overflow-wrap:anywhere}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.blank-sel{flex:1 1 0;min-width:0;font:inherit;font-weight:600;color:var(--ink);background:var(--surface2);border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;padding:8px 10px;min-height:44px}
.blank-sel:focus-visible{outline-offset:0}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,12,22,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-left,0px)) 0 max(0px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:760px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.backup textarea{font-family:var(--font-mono);font-size:12px;min-height:70px}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .bar>i{transition:width .35s ease}
  .tile,.opt,.btn,.chip{transition:background .12s,border-color .12s}
}
</style>

<script>
"use strict";
/* ==========================================================================
   PART 1 — DATA, STATE, SPACED REPETITION
   Everything the app *knows* lives here. The screens (parts 2 and 3) only
   read this state and call grade() / save() to change it.

/* ---- 1. The vocab data (generated from your PDFs by parse_terms.py) ------ */
const DATA = {"processes":["State Formation & Expansion","State Consolidation","Political Fragmentation","Legitimization & Challenges to Authority","Cultural Diffusion","Cultural Syncretism & Reform","Expansion of Trade Networks","Economic Transformation","Social Organization & Change","Technological & Military Innovation","Migration & Population Change","Environmental Adaptation & Change"],"cards":[{"term":"Ocean Faring Technology","unit":4,"definition":"Improvements in ship design and sailing technology that made long-distance ocean travel safer, faster, and more profitable. The caravel was small and maneuverable, the carrack carried large amounts of cargo, the Dutch fluyt transported goods economically, and lateen sails helped ships sail at angles to the wind.","example":"Portugal used caravels to explore the African coastline. Spain used larger ocean-going ships for Atlantic voyages, while Dutch fluyts helped merchants compete in European and overseas trade.","spice":["Technology","Economic"],"process":["Technological & Military Innovation","Expansion of Trade Networks"],"why":"Better ships reduced the risks and costs of ocean travel, allowing Europeans to establish permanent maritime trade routes. These innovations helped shift some long-distance commerce toward Atlantic and oceanic networks, contributing to European overseas expansion."},{"term":"Christopher Columbus","unit":4,"definition":"Italian navigator who sailed for Spain in 1492 seeking a westward route to Asia. Instead, he reached islands in the Caribbean, beginning sustained contact between Europe and the Americas.","example":"Columbus's first voyage reached the Caribbean in 1492. Subsequent Spanish expeditions established colonies on Caribbean islands and expanded European exploration of the Americas.","spice":["Political","Economic","Environmental Interaction"],"process":["State Formation & Expansion","Migration & Population Change"],"why":"Columbus's voyages initiated sustained transatlantic connections that led to European colonization, the Columbian Exchange, and the expansion of forced labor systems. These developments transformed populations, economies, and environments on both sides of the Atlantic."},{"term":"Vasco da Gama","unit":4,"definition":"Portuguese explorer who reached India by sailing around Africa's Cape of Good Hope in 1498, establishing a direct sea route between Europe and the Indian Ocean trade network.","example":"Da Gama reached Calicut, India, in 1498, helping Portugal establish a maritime commercial presence in the Indian Ocean.","spice":["Economic","Political","Technology"],"process":["Expansion of Trade Networks","State Formation & Expansion"],"why":"Portugal could now obtain Asian luxury goods through direct ocean trade rather than relying entirely on established Mediterranean and overland intermediaries. Portuguese fleets subsequently used naval force and fortified ports to compete for control over profitable maritime trade."},{"term":"Portuguese Exploration","unit":4,"definition":"Portuguese efforts during the 1400s to explore the Atlantic and African coasts in search of trade routes, wealth, and opportunities for Christian expansion. Prince Henry the Navigator sponsored voyages and exploration, although he did not personally lead these expeditions.","example":"Portuguese sailors explored the western African coastline, established trading connections, and eventually rounded the Cape of Good Hope under Bartolomeu Dias in 1488.","spice":["Political","Economic","Technology"],"process":["Technological & Military Innovation","Expansion of Trade Networks"],"why":"Royal sponsorship combined navigational knowledge, shipbuilding improvements, and commercial ambitions. Portuguese exploration established the foundations for a trading-post empire and encouraged other European kingdoms to finance oceanic voyages."},{"term":"Ferdinand Magellan","unit":4,"definition":"Portuguese-born explorer who commanded a Spanish expedition beginning in 1519 to find a westward passage to Asia. Magellan died in the Philippines in 1521, but surviving members of his expedition completed the first recorded circumnavigation of the globe in 1522.","example":"Magellan's expedition crossed the Atlantic, sailed through the strait at South America's southern end, and crossed the Pacific before one surviving ship returned to Spain.","spice":["Technology","Economic","Political"],"process":["Technological & Military Innovation","Expansion of Trade Networks"],"why":"The expedition demonstrated that the world's oceans were connected by navigable routes while revealing the enormous distances and dangers involved. It improved European geographical knowledge and contributed to later transpacific commerce."},{"term":"Columbian Exchange","unit":4,"definition":"Widespread transfer of plants, animals, diseases, people, and ideas between the Eastern and Western Hemispheres after 1492.","example":"American crops such as potatoes and maize spread to Europe, Africa, and Asia. Europeans introduced horses, cattle, wheat, and diseases such as smallpox into the Americas.","spice":["Environmental Interaction","Social","Economic"],"process":["Environmental Adaptation & Change"],"why":"New crops increased food supplies and supported population growth in many regions. However, European diseases devastated Indigenous American populations, while introduced animals and plantation agriculture transformed American environments. The exchange permanently connected the world's ecosystems and economies.","flag":"Your chart lists \"Agricultural Diffusion\" here, which isn't one of the 12 Key Processes (it looks left over from an older version of the chart). The drills only use the 12, so this card is scored on Environmental Adaptation & Change. Check with your teacher whether a second process is expected."},{"term":"Great Dying","unit":4,"definition":"Catastrophic population decline among Indigenous Americans following European contact, primarily caused by epidemic diseases, combined with warfare, displacement, and colonial exploitation.","example":"Smallpox and other introduced diseases devastated communities in Mexico and the Andes during the Spanish conquest and subsequent colonial period.","spice":["Environmental Interaction","Social","Economic"],"process":["Migration & Population Change","Environmental Adaptation & Change"],"why":"Massive population losses weakened Indigenous societies, disrupted agricultural production, and contributed to Spanish conquest and colonial control. Labor shortages also encouraged colonizers to expand the forced migration and enslavement of Africans, reshaping Atlantic societies."},{"term":"Trading Post Empire","unit":4,"definition":"Maritime empire that controlled strategically located ports, forts, and commercial routes rather than conquering extensive inland territories.","example":"Portugal established fortified trading posts at Goa in India, Malacca in Southeast Asia, and Hormuz near the Persian Gulf to influence Indian Ocean commerce.","spice":["Political","Economic"],"process":["State Formation & Expansion","Expansion of Trade Networks"],"why":"European states used naval power and strategic ports to control commercial chokepoints without requiring the armies and administrators needed to conquer large inland territories. This allowed relatively small European kingdoms to become influential participants in established Asian trade networks."},{"term":"Mercantilism","unit":4,"definition":"Economic philosophy that viewed international trade as a competition for wealth and power. Governments sought favorable balances of trade, encouraged exports, restricted competing imports, and used colonies to supply raw materials and markets.","example":"Spain restricted much of its colonial trade to approved Spanish ports and merchants, attempting to keep American silver and commercial profits within its imperial system.","spice":["Economic","Political"],"process":["Economic Transformation","State Consolidation"],"why":"European governments used trade regulations, monopolies, and colonial possessions to increase state revenue and support military power. Mercantilist competition encouraged imperial expansion, commercial rivalries, smuggling, and conflicts between European states."},{"term":"Global Silver Trade","unit":4,"definition":"Worldwide exchange of silver, particularly silver bullion (precious metal in bulk form), connecting the Americas, Europe, and Asia. Manila galleons were Spanish trading ships that transported American silver across the Pacific in exchange for Asian goods.","example":"Silver mined at Potosí in present-day Bolivia and Zacatecas in Mexico entered global trade networks. Spanish merchants exchanged American silver for Chinese silk, porcelain, and other Asian products through Manila.","spice":["Economic","Political","Environmental Interaction"],"process":["Expansion of Trade Networks","Economic Transformation"],"why":"American silver helped connect previously separate commercial networks into an increasingly global economy. Chinese demand for silver encouraged transpacific commerce, while silver imports helped fuel inflation in parts of Europe and expanded colonial mining operations that depended heavily on coercive labor."},{"term":"Triangular Trade and Middle Passage","unit":4,"definition":"Triangular trade describes Atlantic commercial connections linking Europe, Africa, and the Americas through exchanges of manufactured goods, enslaved Africans, and plantation commodities. The Middle Passage was the forced Atlantic voyage of enslaved Africans to the Americas.","example":"European merchants transported goods to African markets, purchased enslaved captives, and shipped them across the Atlantic. American plantations produced sugar, tobacco, and other commodities for European markets.","spice":["Economic","Social","Environmental Interaction"],"process":["Expansion of Trade Networks","Migration & Population Change"],"why":"Atlantic trade generated enormous commercial profits while expanding plantation economies dependent on enslaved labor. The forced migration of millions of Africans transformed American populations, created new African diaspora communities, and contributed to severe exploitation and demographic disruption in affected African societies."},{"term":"Trading Companies","unit":4,"definition":"Joint-stock companies were businesses funded by multiple investors who shared ownership, risks, and potential profits. Royal chartered monopolies were companies granted exclusive commercial privileges by governments, sometimes including the authority to establish forts, negotiate treaties, or wage war.","example":"The Dutch East India Company, founded in 1602, raised investment capital through shares and received a Dutch government charter granting extensive trading and political privileges in Asia.","spice":["Economic","Political"],"process":["Economic Transformation","State Formation & Expansion"],"why":"Shared investment allowed merchants to finance expensive voyages while spreading financial risk. Royal charters allowed governments to pursue commercial expansion through private companies, helping corporations become powerful instruments of overseas imperialism."},{"term":"East India Companies","unit":4,"definition":"Powerful European trading companies established to participate in Asian commerce. The Dutch East India Company (VOC, 1602) and English East India Company (EIC, 1600) operated under government charters and combined commercial activities with increasing political and military influence.","example":"The Dutch East India Company established Batavia on Java and competed for control of the Indonesian spice trade. The English East India Company established trading settlements at Madras, Bombay, and Calcutta.","spice":["Economic","Political"],"process":["Expansion of Trade Networks","State Formation & Expansion"],"why":"These companies demonstrated how private investment and state support could expand imperial influence overseas. Their fortified settlements, trade monopolies, and military forces gradually challenged local political authorities and competing European merchants."},{"term":"Coercive Labor","unit":4,"definition":"Labor obtained or controlled through force, threats, legal obligations, debt, or severe restrictions on personal freedom rather than through freely negotiated employment.","example":"Spanish colonial authorities compelled Indigenous workers to provide labor through institutions such as the encomienda and colonial mita. Plantation owners in the Americas relied on enslaved African labor.","spice":["Social","Economic","Political"],"process":["Economic Transformation","Social Organization & Change"],"why":"Colonial governments and landowners used coercive labor to extract valuable resources and produce profitable exports at low labor costs. These arrangements increased imperial wealth while creating systems of exploitation, inequality, resistance, and long-lasting social divisions."},{"term":"Encomienda System","unit":4,"definition":"Spanish colonial institution in which the Crown granted colonists the right to demand tribute and labor from designated Indigenous communities, supposedly in exchange for protection and Christian instruction.","example":"Spanish encomenderos in the Caribbean and New Spain demanded agricultural labor, mining work, or tribute from Indigenous communities following Spanish conquest.","spice":["Economic","Social","Political"],"process":["Economic Transformation","Social Organization & Change"],"why":"Encomienda grants allowed Spanish colonists to extract wealth from conquered populations while reinforcing colonial social hierarchies. Widespread exploitation and Indigenous population decline contributed to reforms, restrictions, and the growth of other colonial labor arrangements."},{"term":"Mita System","unit":4,"definition":"Labor draft originally used by the Inca Empire for public projects and state service. Spanish colonial authorities adapted the system to require rotational labor, particularly in Andean silver mines.","example":"Spanish authorities required designated Indigenous Andean communities to supply workers for silver mining at Potosí.","spice":["Economic","Political","Social"],"process":["Economic Transformation","Social Organization & Change"],"why":"Spanish rulers adapted an existing Indigenous labor institution to serve colonial commercial interests. The colonial mita provided workers for valuable silver mines but imposed severe burdens on Indigenous communities, demonstrating how conquest could preserve older institutions while changing their purposes."},{"term":"Hacienda System","unit":4,"definition":"Large landed estate in Spanish America devoted to agriculture or livestock production. Haciendas employed different forms of labor, including wage labor, tenant labor, and debt-dependent labor.","example":"Spanish landowners established haciendas in New Spain that produced wheat, livestock, and other agricultural goods for colonial settlements and mining centers.","spice":["Economic","Social"],"process":["Economic Transformation","Social Organization & Change"],"why":"Haciendas concentrated land and economic power among colonial elites while supplying expanding settlements and commercial markets. Dependence on landowners could restrict workers' economic freedom and contributed to patterns of rural inequality that survived beyond the colonial period."},{"term":"Indentured Servitude","unit":4,"definition":"Labor arrangement in which individuals agreed or were legally bound to work for an employer for a specified period, often in exchange for transportation, food, housing, or repayment of debt.","example":"European indentured servants traveled to English colonies such as Virginia, agreeing to work for several years to repay the cost of their passage across the Atlantic.","spice":["Social","Economic"],"process":["Migration & Population Change","Economic Transformation"],"why":"Indentured servitude supplied labor to colonial farms and plantations while allowing some Europeans to migrate despite lacking money for transportation. Although contracts were generally temporary, servants frequently faced harsh conditions, limited rights, and punishment. This system differed from hereditary racial chattel slavery."},{"term":"Chattel Slavery","unit":4,"definition":"System of slavery in which enslaved people were legally treated as property that could be bought, sold, and inherited. In Atlantic plantation societies, chattel slavery increasingly became racialized and hereditary.","example":"European plantation owners in Barbados and Brazil forced enslaved Africans and their descendants to cultivate sugar for Atlantic markets.","spice":["Social","Economic","Political"],"process":["Migration & Population Change","Social Organization & Change"],"why":"Chattel slavery enabled plantation owners to build profitable export economies through forced labor. Laws increasingly tied enslaved status to African ancestry, producing hereditary racial hierarchies and inequalities that shaped societies throughout the Atlantic world."},{"term":"Maroon Communities","unit":4,"definition":"Communities established by formerly enslaved Africans who escaped slavery and created independent settlements, often in remote mountains, forests, or swamps.","example":"Escaped enslaved Africans established Palmares in colonial Brazil during the 1600s. Its inhabitants resisted repeated Portuguese military campaigns until the settlement's final destruction in 1694.","spice":["Social","Political","Cultural"],"process":["Legitimization & Challenges to Authority","Social Organization & Change"],"why":"Maroon communities challenged the authority of colonial governments and slaveholders by establishing independent settlements. Their resistance forced colonial powers to devote military resources to suppressing rebellion and demonstrated that enslaved people actively fought to obtain and preserve freedom."},{"term":"Pueblo Revolt","unit":4,"definition":"Successful Indigenous uprising in 1680 against Spanish colonial rule in present-day New Mexico, driven by forced labor, religious persecution, and colonial interference in Pueblo communities.","example":"Pueblo communities, coordinated in part by the leader Po'pay, attacked Spanish settlements and forced Spanish colonists to retreat from New Mexico in 1680. Spanish authorities reestablished colonial control beginning in 1692.","spice":["Political","Cultural","Social"],"process":["Legitimization & Challenges to Authority","State Formation & Expansion"],"why":"The Pueblo Revolt demonstrated that Indigenous peoples could organize resistance and temporarily overthrow European colonial control. The uprising challenged Spanish religious and political authority and contributed to changes in Spanish colonial policies after reconquest."},{"term":"Colonial Caste System","unit":4,"definition":"Social hierarchy in Spanish colonial America that classified people according to ancestry, birthplace, and perceived racial identity. Peninsulares were Spaniards born in Spain; creoles (criollos) were people of Spanish ancestry born in the Americas; mestizos were generally people of European and Indigenous ancestry; and mulattoes was a historical classification generally used for people of European and African ancestry.","example":"Peninsulares frequently received the highest colonial government appointments in New Spain, while wealthy creoles owned estates and businesses. Mestizos, people of African ancestry, and Indigenous communities experienced varying degrees of legal and social discrimination.","spice":["Social","Political","Economic"],"process":["Social Organization & Change","State Consolidation"],"why":"Colonial authorities and elites used social classifications to reinforce differences in status, wealth, and political privilege. These distinctions shaped access to offices, property, employment, and legal rights, although actual colonial society was more complex and flexible than a rigid caste pyramid suggests."},{"term":"Casta Paintings","unit":4,"definition":"Paintings produced mainly in eighteenth-century Spanish America that depicted families and individuals according to colonial categories of ancestry and social status. They often included clothing, occupations, and household possessions to suggest differences in social position.","example":"Artists in New Spain created series of casta paintings portraying couples of different ancestries and their children, frequently labeling them with terms such as español, mestizo, and mulato.","spice":["Social","Cultural","Political"],"process":["Social Organization & Change","Cultural Syncretism & Reform"],"why":"Casta paintings reveal how some colonial elites attempted to classify and organize increasingly diverse populations. They provide historians with visual evidence of colonial attitudes toward ancestry, identity, and social hierarchy, although the paintings reflected elite ideas rather than a complete picture of everyday life."},{"term":"Colonial Syncretism","unit":4,"definition":"Religious syncretism is the blending or adaptation of beliefs and practices from different religious traditions. Santería developed through interactions between Yoruba religious traditions and Catholicism, while Haitian Vodou developed through the adaptation of West and Central African religious traditions in a Catholic colonial environment.","example":"Enslaved Africans in Caribbean plantation societies preserved elements of African religious traditions while adapting their practices under European colonial rule. These cultural interactions contributed to the development of Santería in Cuba and Vodou in Saint-Domingue, later Haiti.","spice":["Cultural","Social"],"process":["Cultural Diffusion","Cultural Syncretism & Reform"],"why":"Enslaved Africans and their descendants preserved and transformed elements of their cultural identities despite forced migration and colonial persecution. Religious syncretism demonstrates how contact between societies can produce new traditions while maintaining connections to older beliefs and practices."},{"term":"Qing Dynasty","unit":3,"definition":"China's last imperial dynasty (1644–1912), established by the Manchus after the Ming Dynasty. Expanded Chinese territory into Taiwan, Tibet, Mongolia, and Central Asia.","example":"Yuan Dynasty - Mongol rulers governed China by adopting Chinese traditions while maintaining their own identity.","spice":["Political","Cultural"],"process":["State Formation & Expansion","State Consolidation"],"why":"The Manchus conquered Ming China, retained its bureaucracy, and expanded Qing territory through military campaigns. Demonstrated how foreign conquerors could maintain power by combining traditional institutions with military strength. Expanded China's territorial influence."},{"term":"Mughal Empire","unit":3,"definition":"Muslim empire (1526–1857) that controlled much of India. Known for combining Persian, Islamic, and Indian cultures while struggling to govern a large, religiously diverse population.","example":"Delhi Sultanate - Muslim rulers governed a predominantly Hindu population in northern India.","spice":["Political","Cultural"],"process":["State Formation & Expansion","Cultural Syncretism & Reform"],"why":"Mughal emperors conquered much of India and used taxes, officials, and alliances with local elites to govern diverse peoples. Created a wealthy, culturally diverse empire but demonstrated the difficulty of maintaining unity across religious and regional differences."},{"term":"Ottoman Empire","unit":3,"definition":"Powerful Islamic empire (c. 1299–1922) founded by Turkic peoples. Captured Constantinople in 1453 and controlled territories across southeastern Europe, North Africa, and the Middle East.","example":"Ottoman Military - Made extensive use of cannons and gunpowder weapons to seize major trade hubs like Constantinople (now Istanbul) to expand the empire.","spice":["Political","Cultural","Technology"],"process":["State Formation & Expansion","State Consolidation"],"why":"Ottoman rulers used gunpowder armies to conquer territory and bureaucratic and religious institutions to maintain control. Controlled strategic trade routes connecting Europe and Asia and demonstrated the power of military technology and centralized administration."},{"term":"Safavid Empire","unit":3,"definition":"Persian empire (1501–1736) that established Shi'a Islam as its official religion. Developed a distinct Persian identity and frequently competed with the Sunni Ottoman Empire.","example":"Succession to the Ilkhanate empire, outsting the Mongol rulers and reestablishing Shi’a Islam as the dominant religion. Combines Persian Zoroastrian traditions of a god king’s bloodline with following the blood relatives of Prophet Muhammad.","spice":["Political","Cultural"],"process":["State Consolidation","Legitimization & Challenges to Authority"],"why":"Safavid rulers promoted Shi’a Islam to unify Persia and distinguish their empire from Sunni rivals. Established Persia as a major Shi'a Muslim center, contributing to lasting religious and political divisions in the Islamic world such as the Saudi Arabia/Iran rivalry."},{"term":"Songhai Empire","unit":3,"definition":"Major West African Islamic empire that flourished during the 15th and 16th centuries after replacing Mali. Controlled important Trans-Saharan trade routes before falling to Moroccan invaders in 1591.","example":"Successor to the Malian Empire. Mali grew based on control of gold and salt trade essential to Silk Road commerce and food preservation. Mali fell because it failed to keep up infrastructure and lack of merit in its bureaucracy leading to corruption. Songhai repeats the cycle.","spice":["Political","Economic"],"process":["State Formation & Expansion","Expansion of Trade Networks"],"why":"Songhai conquered Niger River trading cities and taxed merchants along Trans-Saharan routes. Demonstrated how control of trade supported powerful African empires, but also how military technology could shift regional power.","flag":"Your chart had Safavid text in this card's Process line (a copy-paste slip). I filled in the two processes that fit its Why it Matters; check them against your teacher's version."},{"term":"Devshirme","unit":3,"definition":"Ottoman recruitment system that took Christian boys, primarily from the Balkans, converted them to Islam, and trained them as soldiers or government administrators.","example":"Similar to Chinese Civil Service Examination but designed to enforce stricter loyalty to the state. Those selected often were castrated to ensure they could have no family and thus the state was their family.","spice":["Political","Social"],"process":["State Consolidation","Social Organization & Change"],"why":"Ottoman officials recruited and trained Christian boys for military and government service tied to the sultan. Helped the Ottoman sultan create a powerful government and military with officials whose careers depended on his authority. Became a major problem later in the empire as they became reliant on devshirme from restive populations to maintain their government."},{"term":"Janissaries","unit":3,"definition":"Elite Ottoman infantry soldiers, many recruited through the devshirme system. Trained to serve the sultan and equipped with gunpowder firearms.","example":"Soldiers recruited through devshirme. Designed to be meritocratic but with intense loyalty to the state. Eventually janissaries realized they controlled the real power and used it to overthrow Sultans leading to chaos and decline.","spice":["Political","Technology"],"process":["State Consolidation","Technological & Military Innovation"],"why":"Professional infantry equipped with firearms strengthened Ottoman conquest and the sultan’s authority. Helped establish the Ottoman Empire as a major gunpowder power and strengthened the sultan's military authority."},{"term":"Divine Right","unit":3,"definition":"Belief that a monarch receives authority to rule directly from God and is ultimately accountable to God rather than ordinary subjects.","example":"Similar to China’s Mandate of Heaven where rulers received authority from Heaven but could lose it through poor governance. Europeans envisioned the Catholic Church as the one to bestow God’s approval to kings and queens.","spice":["Political","Cultural"],"process":["Legitimization & Challenges to Authority","State Consolidation"],"why":"European monarchs claimed their authority came from God to justify royal rule and discourage challenges. Strengthened royal authority and helped justify absolute monarchy, although religious and political reformers increasingly challenged such claims."},{"term":"Absolute Monarchy","unit":3,"definition":"System of government in which a hereditary monarch holds nearly unlimited political authority, with few effective restrictions from representative institutions.","example":"As states centralized, they abolished feudal institutions to increase the power of the central state held by the king/queen. The Louis line in France emphasized their absolute rule while England pursued a parliamentary system balancing power of legislative and executive.","spice":["Political"],"process":["State Consolidation","Legitimization & Challenges to Authority"],"why":"Monarchs reduced noble independence while expanding royal bureaucracies, taxation, and standing armies. Strengthened centralized states such as France under Louis XIV but created conflicts over taxation, representation, and royal power."},{"term":"Taj Mahal","unit":3,"definition":"Elaborate marble mausoleum built in Agra, India, by Mughal emperor Shah Jahan in memory of his wife Mumtaz Mahal. Completed mainly during the 1640s and 1650s.","example":"France’s Palace of Versailles built as an estate for the Louis family. Hundreds of room, expansive gardens designed to show off their magnificence and power (and the debt used to build it).","spice":["Cultural","Political"],"process":["Legitimization & Challenges to Authority","Cultural Syncretism & Reform"],"why":"Shah Jahan displayed Mughal wealth and authority through a monument blending Persian, Islamic, and Indian styles. Demonstrated Mughal wealth, imperial power, and cultural blending, while showing how rulers used architecture to display prestige."},{"term":"Tax Farming","unit":3,"definition":"System in which governments gave private individuals the right to collect taxes in exchange for payments to the state. Used in the Ottoman Empire and other states.","example":"Mughal Zamindars targeting non-Muslims. Jizyra from the Ottomans.","spice":["Economic","Political"],"process":["State Consolidation","Economic Transformation"],"why":"Empires delegated tax collection to private agents to fund armies and administration, sometimes weakening oversight. Helped empires finance armies and administration but could encourage corruption, exploitation, and weaker central control."},{"term":"Protestant Reformation","unit":3,"definition":"Religious movement beginning in 1517 when Martin Luther challenged Catholic Church practices. Led to the formation of Protestant Christian denominations such as Lutheranism, Calvinism, and Anglicanism.","example":"Continues Europe’s challenge to authority weakening the religious monopoly of the Catholic Church allowing new competing power blocks like England to begin taking centerstage.","spice":["Cultural","Political"],"process":["Legitimization & Challenges to Authority","Cultural Syncretism & Reform"],"why":"Reformers challenged Catholic authority, while printing and supportive rulers spread Protestant ideas. Divided Western Christianity, weakened the Catholic Church's religious monopoly, and contributed to major political conflicts in Europe."},{"term":"Ninety-Five Theses","unit":3,"definition":"Arguments written by Martin Luther in 1517 criticizing the Catholic Church's sale of indulgences and calling for religious debate and reform.","example":"Block printing from Asia inspires the printing press in Europe allowing for fast printing of books and pamphlets spreading ideas faster than those in power could stop them.","spice":["Cultural","Technology"],"process":["Legitimization & Challenges to Authority","Technological & Military Innovation"],"why":"Luther’s criticisms of indulgences spread rapidly through printing and encouraged wider religious debate. Helped begin the Protestant Reformation and demonstrated how communication technology could spread ideas that challenged powerful institutions."},{"term":"Catholic Reformation (Counter-Reformation)","unit":3,"definition":"Catholic Church's response to Protestantism during the 16th and 17th centuries. Reaffirmed Church teachings, addressed corruption, expanded missionary work, and strengthened religious discipline.","example":"Reforms corruption by ending selling of offices, new standards for education for priests (actually have to be able to read), and ends selling of indulgences.","spice":["Cultural","Political"],"process":["Cultural Syncretism & Reform","Legitimization & Challenges to Authority"],"why":"Catholic leaders reaffirmed doctrine, corrected abuses, and expanded education and missions to strengthen the Church. Revitalized Catholicism, slowed Protestant expansion in some regions, and expanded Catholic influence through global missionary activity."},{"term":"Jesuits","unit":3,"definition":"Catholic religious order called the Society of Jesus, founded in 1540. Focused on education, missionary work, and strengthening Catholic influence during the Counter-Reformation.","example":"Expand influence of Catholic leaders such as Spain sending Jesuits into the Americas to convert native peoples to build greater loyalty to the Spanish state.","spice":["Cultural"],"process":["Cultural Diffusion","Cultural Syncretism & Reform"],"why":"Jesuit teachers and missionaries spread Catholicism through schools and missions while engaging with local traditions. Spread Catholic Christianity worldwide and contributed to cultural exchanges between Europe, Asia, and the Americas."},{"term":"Indulgence","unit":3,"definition":"In Catholic teaching, a remission of temporal punishment for sins whose guilt has already been forgiven. Abuses involving payments for indulgences became a major target of Protestant criticism.","example":"Major scandal where the funding for a cathedral’s renovation was paid for by indulgences. Priests gave the impression you could buy your way into Heaven.","spice":["Cultural","Economic"],"process":["Legitimization & Challenges to Authority","Economic Transformation"],"why":"Controversies over payments connected to indulgences fueled criticism of Church practices and demands for reform. Controversies over indulgences helped trigger the Protestant Reformation and weakened confidence in Church leadership."},{"term":"Simony","unit":3,"definition":"Practice of buying or selling Church offices or spiritual privileges, widely condemned as corruption within Christianity.","example":"Part of corruption of a bureaucracy. Similar practices done in other failing states and organizations such as at the end of Chinese dynasties.","spice":["Cultural","Political"],"process":["Legitimization & Challenges to Authority","State Consolidation"],"why":"The sale of Church offices weakened trust in religious leadership and strengthened calls to reform corruption. Undermined trust in Church leadership and contributed to demands for reform, including efforts to enforce existing prohibitions against simony."},{"term":"Inquisition","unit":3,"definition":"Catholic Church tribunals established to investigate suspected heresy and enforce religious orthodoxy. Some inquisitions predated the Protestant Reformation, while others became important during Catholic reform.","example":"Used to purge dissent. In the Americas, the Church sought to end practice of native religions and eliminate syncretic forms of Christianity to maintain purity and power.","spice":["Cultural","Political"],"process":["Legitimization & Challenges to Authority","State Consolidation"],"why":"Church tribunals investigated suspected heresy, sometimes with state support, to enforce religious conformity. Demonstrated how religious institutions and governments used authority to enforce conformity, contributing to religious persecution and intolerance."},{"term":"Thirty Years' War","unit":3,"definition":"Devastating European conflict (1618–1648) beginning with tensions between Catholics and Protestants in the Holy Roman Empire. Expanded into a broader struggle for political power.","example":"Final conclusion of the crusading ideas as Europe destroys itself. Constant warfare against an external threat often turns inward as there is an attempt to crush dissent. Germany’s destruction leads to France’s ascendence.","spice":["Political","Cultural"],"process":["Political Fragmentation","Legitimization & Challenges to Authority"],"why":"Catholic-Protestant tensions and dynastic rivalries drew European states into war and weakened the Holy Roman Empire. Weakened the Holy Roman Empire, devastated parts of Central Europe, and produced the Peace of Westphalia in 1648, changing European political relationships."},{"term":"John Calvin","unit":3,"definition":"French Protestant theologian (1509–1564) who developed Calvinism, a branch of Christianity emphasizing God's sovereignty and predestination.","example":"Similar to Martin Luther breaking away from the Catholic Church and reinterpreting Christian church doctrine. Similar to Buddhism changing as it appeals to different cultures. Clavin’s predestination appealed to elites and wealthy while Lutheranism appealed to regular people. (God saves based on his plan versus salvation through faith.)","spice":["Cultural","Political"],"process":["Cultural Syncretism & Reform","Cultural Diffusion"],"why":"Calvin developed Protestant teachings in Geneva that spread through followers and challenged Catholic religious unity. Influenced Protestant movements throughout Europe and helped establish religious communities that challenged Catholic authority."},{"term":"Sikhism","unit":3,"definition":"Monotheistic religion founded by Guru Nanak in the Punjab region of South Asia during the late 15th century. Developed in a region influenced by Hindu and Islamic traditions while establishing distinct beliefs and practices.","example":"Similar to the creation of Bahkti movement, showing influence of an invading power bringing its religion creating traditions. Used by Mughals to help establish power of fellow Muslims. But get discriminated against when empire is trapped in a purity spiral.","spice":["Cultural","Social"],"process":["Cultural Syncretism & Reform","Cultural Diffusion"],"why":"Guru Nanak’s teachings arose amid Hindu-Islamic interaction and developed into a distinct Sikh religious community. Demonstrated religious innovation and cultural interaction in South Asia and became an important religious identity within the Mughal Empire."},{"term":"Shogunate","unit":3,"definition":"Japanese military government led by a shogun, who exercised effective political authority while the emperor remained the symbolic ruler.","example":"Similar to Russian Empire which was more feudal based. Japanese transition away from the Shogunate to the empire helped advance their power. Russia was last to transition away leaving them weaker versus other empires.","spice":["Political","Social"],"process":["State Consolidation","Legitimization & Challenges to Authority"],"why":"Military rulers governed through regional lords, while Tokugawa shoguns tightened control over those lords. Maintained warrior-based government in Japan. The Tokugawa Shogunate eventually strengthened centralized control and promoted centuries of relative internal stability."},{"term":"Daimyo","unit":3,"definition":"Powerful Japanese landholding lords who controlled regional territories and commanded armies of samurai. Their authority was increasingly regulated under the Tokugawa Shogunate.","example":"Similar to European feudal lords who controlled lands in return for military service and owned manors or estates. Reducing the power of the daimyo became key to Japanese state centralization.","spice":["Political","Social"],"process":["Political Fragmentation","State Consolidation"],"why":"Regional lords controlled land and samurai, but Tokugawa alternate attendance limited their independence. Demonstrated the importance of regional military power in Japan and how centralized governments could gradually control local elites."},{"term":"Jizya","unit":3,"definition":"Tax historically imposed on certain non-Muslim subjects, especially Jews and Christians, under Islamic governments. Its application varied by ruler and empire.","example":"Similar to Zamindar though more directly targeted at non-Muslims as coercive tax instrument to force people to convert. Conversions built loyalty to state controlled mosques while taxes provided extra income, initially.","spice":["Economic","Cultural","Political"],"process":["State Consolidation","Social Organization & Change"],"why":"Muslim rulers collected a tax from certain non-Muslim subjects while regulating the rights of religious communities. Helped Muslim rulers generate revenue and govern religious diversity, but also reinforced legal distinctions between religious communities."},{"term":"Millet System","unit":3,"definition":"Ottoman arrangement in which recognized religious communities administered certain internal matters, such as marriage, education, and religious affairs, under their own religious leadership.","example":"Similar to Mongol religious tolerance to maintain stability. Not a liberal multicultural policy but designed to reduce need for internal security. Breaks down during times of crises as dominant religion attakcs minorities.","spice":["Political","Cultural","Social"],"process":["State Consolidation","Social Organization & Change"],"why":"Ottoman officials allowed recognized religious communities to manage some internal affairs under imperial authority. Allowed the Ottoman Empire to manage religious diversity and maintain stability without requiring all subjects to follow the same religion."},{"term":"Silk Road","unit":2,"definition":"Network of land trade routes connecting China and Central Asia with the Middle East, Europe, and Africa.","example":"Merchants traded valuable luxury goods such as Chinese silk while technologies including paper, gunpowder, and the compass spread between societies.","spice":["Economic","Cultural","Technology"],"process":["Expansion of Trade Networks","Cultural Diffusion"],"why":"The Silk Roads connected distant societies and increased the movement of goods, technologies, ideas, religions, and diseases across Afro-Eurasia. Because land transportation was expensive, trade focused heavily on valuable luxury goods."},{"term":"Luxury Trade Goods","unit":2,"definition":"Expensive goods traded over long distances because wealthy consumers were willing to pay high prices for them.","example":"Silk from China, spices from South and Southeast Asia, and gold from West Africa traveled through major trade networks.","spice":["Economic","Cultural"],"process":["Expansion of Trade Networks","Economic Transformation"],"why":"High-value goods made long-distance trade profitable and encouraged states to protect, control, and tax trade routes."},{"term":"Caravanserais","unit":2,"definition":"Inns and trading posts along major land trade routes where merchants and their animals could rest and exchange goods.","example":"States supported caravanserais along the Silk Roads to make long-distance trade safer and easier.","spice":["Economic","Cultural"],"process":["Expansion of Trade Networks","Cultural Diffusion"],"why":"Caravanserais encouraged merchants from different societies to meet and exchange goods, languages, religions, and ideas. This increased both trade and cultural syncretism along the Silk Roads."},{"term":"Mongol Empire","unit":2,"definition":"Vast empire created by Chinggis Khan and his successors through the conquest of much of Eurasia. Helped revive the Silk Road and European interest in trade. Militarized political structure where all parts of society organized into military units and supports. Early model of modern fascism.","example":"The empire eventually divided into major khanates, including the Yuan Dynasty in China and Ilkhanate in Persia. Mongol protection of trade routes encouraged merchants and travelers to move across Eurasia.","spice":["Political","Economic","Social","Cultural"],"process":["State Formation & Expansion","Political Fragmentation"],"why":"Mongol conquest temporarily connected much of Eurasia under related rulers, creating the conditions for the Pax Mongolica. Mongols frequently adopted the cultures and religions of the societies they conquered, while their empire accelerated trade, migration, and cultural diffusion."},{"term":"Mongol Rule","unit":2,"definition":"Mongol methods of governing conquered peoples while often adopting local customs and institutions.","example":"Mongol rulers protected trade routes, rebuilt infrastructure after conquest, supported scholars, and brought people with specialized knowledge from different parts of Eurasia together. Mongol rulers adopted many Chinese governing practices while maintaining Mongol political privileges. Yuan rule also connected China more closely with the wider Eurasian trade network. Yuan rulers restored roads and canals, supported long-distance trade, used paper currency, and permitted Buddhism, Daoism, Islam, Christianity, and other religions.","spice":["Political","Cultural","Economic","Technology"],"process":["State Consolidation","Cultural Diffusion"],"why":"Mongols conquered through military force but usually governed by adapting to local societies. Their empire increased contact among Chinese, Persian, Islamic, and European peoples and helped knowledge move across Eurasia. Mongol rule connected distant regions more closely than before. Trade and technology spread rapidly, but so did warfare, forced migration, and disease."},{"term":"Pax Mongolica","unit":2,"definition":"Period of increased stability and security across much of Eurasia under Mongol rule.","example":"Mongol protection of Silk Road routes allowed merchants, diplomats, missionaries, and travelers such as Marco Polo to travel more easily between Europe and Asia.","spice":["Political","Economic","Cultural"],"process":["Expansion of Trade Networks","Cultural Diffusion"],"why":"Greater security increased trade, diplomacy, and cultural exchange across Eurasia. Europeans gained greater knowledge of Asian wealth and geography, helping increase later European interest in reaching Asia. Christian kingdoms explored alliances with non-Muslim kingdoms like the Mongols to counter Islamic power. Imperial protection reduced some obstacles to travel across multiple regions."},{"term":"Fall of the Mongols","unit":2,"definition":"Decline and fragmentation of Mongol-controlled states during the 1300s.","example":"In Persia, economic problems and failed attempts to use paper currency weakened the Ilkhanate. In China, plague, inflation, natural disasters, and rebellion contributed to the collapse of the Yuan Dynasty.","spice":["Political","Economic","Social"],"process":["Political Fragmentation","Economic Transformation"],"why":"Mongol states became difficult and expensive to govern. Economic problems, disease, rebellion, and competition among Mongol rulers caused the empire to break into separate states."},{"term":"Indian Ocean Trade","unit":2,"definition":"Maritime trade network connecting East Africa, the Middle East, South Asia, Southeast Asia, and China.","example":"China exported silk and porcelain; East Africa exported gold, ivory, and iron; India traded spices, pepper, cotton textiles, and gems. Merchant communities settled throughout the network.","spice":["Economic","Cultural","Environmental Interaction","Technology"],"process":["Expansion of Trade Networks","Cultural Diffusion"],"why":"Indian Ocean trade moved enormous amounts of goods because ships could carry more cargo than land caravans. It also encouraged diasporic communities and spread religions and cultures across coastal regions."},{"term":"Maritime Technology","unit":2,"definition":"Technologies that allowed sailors to navigate farther, transport more goods, and travel more reliably across oceans.","example":"The magnetic compass helped determine direction, the astrolabe helped sailors estimate latitude, improved sails allowed ships to use changing winds, and larger vessels carried more cargo.","spice":["Technology","Economic"],"process":["Technological & Military Innovation","Expansion of Trade Networks"],"why":"Better maritime technology increased the distance and reliability of sea travel, helping Indian Ocean trade expand."},{"term":"Zheng He","unit":2,"definition":"Chinese Muslim admiral who led enormous Ming treasure fleets across the Indian Ocean during the early 1400s. Showed power of Ming China but also fear of change through exploration.","example":"Zheng He's fleets sailed from China through Southeast Asia and India to Arabia and East Africa, displaying Chinese wealth and power.","spice":["Political","Economic","Technology","Cultural"],"process":["Expansion of Trade Networks","Legitimization & Challenges to Authority"],"why":"His voyages demonstrated China's advanced naval technology and the enormous reach of Indian Ocean trade. Later Ming rulers ended the voyages as government priorities shifted inward."},{"term":"Diasporic Communities","unit":2,"definition":"Communities of people living far from their homeland who maintain parts of their original culture, language, or religion.","example":"Indian Ocean trade created merchant communities such as Chinese communities in Southeast Asia and Arab communities along the East African coast.","spice":["Social","Cultural","Economic"],"process":["Migration & Population Change","Cultural Diffusion"],"why":"Merchant diasporas helped trade by creating trusted communities in foreign ports. Their interaction with local peoples also blended languages, religions, foods, and customs."},{"term":"Trans-Saharan Trade","unit":2,"definition":"Trade network connecting North Africa and West Africa across the Sahara Desert.","example":"West African merchants traded gold, ivory, and enslaved people northward while receiving goods such as salt, textiles, and horses.","spice":["Economic","Cultural","Environmental Interaction"],"process":["Expansion of Trade Networks","Cultural Diffusion"],"why":"Trans-Saharan trade enriched states such as Mali and helped Islam spread into West Africa."},{"term":"Pack Animals","unit":2,"definition":"Domesticated animals used to transport people and goods across difficult terrain.","example":"Camels crossed deserts carrying heavy loads, horses provided speed and military power, oxen transported goods, and llamas carried loads through the Andes.","spice":["Economic","Technology","Environmental Interaction"],"process":["Environmental Adaptation & Change","Expansion of Trade Networks"],"why":"Pack animals lowered the difficulty and cost of moving goods, allowing trade networks to cross deserts, mountains, and grasslands."},{"term":"Camel Saddles","unit":2,"definition":"Specialized saddles developed to make camels more effective for transportation and warfare.","example":"Different saddle designs placed riders behind, above, or near the camel's hump depending upon whether control, comfort, carrying capacity, or battlefield visibility was most important.","spice":["Technology","Economic","Environmental Interaction"],"process":["Technological & Military Innovation","Environmental Adaptation & Change"],"why":"Camel saddles made desert transportation easier and helped merchants carry larger quantities of goods across the Sahara and Arabian deserts."},{"term":"Ibn Battuta","unit":2,"definition":"Muslim scholar and traveler from Morocco who journeyed throughout Africa and Asia during the 1300s. Showed unity of Muslim culture across Dar al-Islam but also how it adapted to local culture.","example":"Ibn Battuta traveled from Morocco through the Middle East, India, Southeast Asia, and Mali, recording the customs and governments he encountered.","spice":["Social","Cultural","Economic"],"process":["Cultural Diffusion","Expansion of Trade Networks"],"why":"His travels demonstrate how Islamic beliefs and trade networks connected societies across Afro-Eurasia despite major cultural differences."},{"term":"Travelers: Marco Polo","unit":2,"definition":"Venetian merchant and traveler whose writings described his travels through Mongol-controlled Asia. Revived European interest in Silk Road.","example":"Marco Polo's account of China introduced many Europeans to the wealth and products of Asia. Later explorers, including Columbus, read stories associated with his travels.","spice":["Cultural","Economic"],"process":["Cultural Diffusion","Expansion of Trade Networks"],"why":"European interest in Asian luxury goods helped encourage later attempts to find direct trade routes to Asia."},{"term":"Cultural Diffusion","unit":2,"definition":"Spread of beliefs, ideas, languages, technologies, and cultural practices from one society to another.","example":"Buddhism spread from India to China along the Silk Roads, where Buddhist ideas blended with Daoism to create Chan (Zen) Buddhism. Islam spread through trade, missionaries, and conquest, contributing to blended cultures such as Swahili in East Africa and Urdu in South Asia.","spice":["Cultural","Social"],"process":["Cultural Diffusion","Cultural Syncretism & Reform"],"why":"Trade networks moved ideas as well as goods. As religions and cultures entered new societies, people adapted and blended them with local traditions, creating new religions, languages, art, and political ideas. These cultural exchanges could serve as bridges between societies, but also create tension within societies experiencing rapid change."},{"term":"Black Death","unit":2,"definition":"Deadly infectious disease that spread across Eurasian trade routes during the 1300s.","example":"The plague spread from China across interconnected trade routes and killed roughly one-third of Europe's population, along with large numbers of people in major cities elsewhere.","spice":["Social","Economic","Environmental Interaction"],"process":["Migration & Population Change","Social Organization & Change"],"why":"Trade networks moved diseases as well as goods and ideas. Massive population loss created labor shortages, allowing surviving workers to demand higher wages while contributing to the decline of many heavily populated cities."},{"term":"Crop Diffusion","unit":2,"definition":"Environmental and population changes caused by the spread of crops and expansion of farming.","example":"Migration and the introduction of new crops increased food production in many regions, encouraging population growth and settlement.","spice":["Environmental Interaction","Social","Economic"],"process":["Environmental Adaptation & Change","Migration & Population Change"],"why":"More food improved nutrition and supported larger populations, but expanding agriculture could also cause deforestation, soil erosion, and environmental degradation. Environmental damage could weaken societies, as seen with the Maya."},{"term":"Commercialization","unit":2,"definition":"Growth of markets and trade in which more goods are produced and exchanged for money and profit.","example":"Expanding trade encouraged the use of paper money, credit, and financial tools such as Chinese “flying cash,” which allowed merchants to transfer value without carrying large amounts of heavy metal coins.","spice":["Economic"],"process":["Economic Transformation","Expansion of Trade Networks"],"why":"Growing trade created larger markets, increased opportunities for merchants and producers, and encouraged development of money, credit, and banking systems. These tools made long-distance trade easier but could also create problems such as debt, inflation, and financial instability."},{"term":"Bureaucracy","unit":1,"definition":"System of government which appointed officials carry out laws, collect taxes, maintain records, and run the state.","example":"Song China use to manage empire and selected with civil service exam.","spice":["Political"],"process":["State Consolidation","Social Organization & Change"],"why":"Bureaucracies let rulers administer large territories, collect taxes, and enforce laws more consistently. However, corruption, excessive rules, or appointments based on favoritism could undermine their effectiveness."},{"term":"Meritocracy","unit":1,"definition":"System in which people gain positions based on abilities and achievements rather than by birth like feudalism.","example":"China's civil service exams tested knowledge and skills for government officials. Overtime became corrupted by only testing for people repeating government positions.","spice":["Social","Political"],"process":["State Consolidation","Social Organization & Change"],"why":"Examinations could help rulers recruit skilled officials and reduce dependence on hereditary elites. Yet unequal access to schooling meant wealthy families still enjoyed major advantages."},{"term":"Infrastructure","unit":1,"definition":"Everything needed to run daily life such as roads, bridges, canals, pipes, electricity, communication networks.","example":"Grand Canal transported rice and other goods via waterways from southern farming cities to northern manufacturing cities.","spice":["Political","Economic"],"process":["State Consolidation","Expansion of Trade Networks"],"why":"Infrastructure allows for more trade, increasing supplies for growing cities, and connecting regions together for control. Failure to maintain infrastructure or poorly designed infrastructure is a leading cause for a country declining."},{"term":"Gunpowder","unit":1,"definition":"Explosive mixture developed in China for fireworks and weapons.","example":"China used gunpowder in early bombs and rockets to attack forts.","spice":["Political","Technology"],"process":["Technological & Military Innovation","State Formation & Expansion"],"why":"Gunpowder spread beyond China and gradually transformed siege warfare and battlefields, especially as armies adopted cannons and firearms. Its military effects depended on training, organization, and access to resources."},{"term":"Agricultural Exchange","unit":1,"definition":"Trade of different kinds of foods increasing crop diversity and production.","example":"Champs Rice from Vietnam allowed Chinese farmers to grow two rice crops per year instead of one.","spice":["Social","Environmental Interaction","Economic"],"process":["Environmental Adaptation & Change","Migration & Population Change"],"why":"Food is the basis of society. More food means you need fewer farmers and more can specialize in manufacturing or technology. Surplus food leads to more trade for something else."},{"term":"Buddhism","unit":1,"definition":"Religion and philosophy emphasizing overcoming suffering to escape the cycle of rebirth. Founded in northern India. Basis for many religions in south and east Asia.","example":"Mahayana Buddhism says anyone (rich/poor) can become enlightened and must help others. Appeals to poor. Theravada Buddhism says one must escape from sins like greed/hate/delusion over many lifetimes to find enlightenment. Appeals to wealthy who are seen as close to enlightenment.","spice":["Cultural"],"process":["Cultural Diffusion","Cultural Syncretism & Reform"],"why":"Religions change as they spread. Different forms of Buddhism arise to appeal to the people. Poor Chinese peasants leaned towards Mahayana to escape strict control of Chinese Confucianism."},{"term":"Neo-Confucianism","unit":1,"definition":"Revived form of Confucian emphasizing social order and proper relationships while adopting some Buddhist ideas such as sins.","example":"Chinese state prompted Confucianism because it says you must obey the government (who must serve you in return)","spice":["Social","Political","Cultural"],"process":["State Consolidation","Legitimization & Challenges to Authority"],"why":"States use ideology and philosophy to reinforce their control. They promote those who believe its ideas, make those ideas into laws, and use the ideas to influence people's daily lives."},{"term":"Feudalism","unit":1,"definition":"Decentralized political system in which local landholding warriors have authority and provide military service in exchange for land or protection.","example":"In Japan, the emperor was a symbolic king with political power who granted land to shogun (military general) and daimyo (lords) and samurai (knights) to support him.","spice":["Social","Political"],"process":["Political Fragmentation","Social Organization & Change"],"why":"Where central governments lacked the ability to enforce authority, local lords often controlled land and military power. These decentralized relationships provided protection and obligations but could produce rivalry and limit central control."},{"term":"Islam","unit":1,"definition":"Monotheistic religion founded by prophet Muhammad. Holy book: Qur'an. Core belief: follow teachings of Muhammad, pray 5 times per day, pilgrimage to Mecca.","example":"Main branch is Sunnism: Successor to Muhammad is chosen by leader. Shia: successor is blood of Muhammad (Iraq/Iran)","spice":["Social","Political","Cultural"],"process":["Cultural Diffusion","Cultural Syncretism & Reform"],"why":"Islam spread through merchants, scholars, missionaries, and conquest, connecting diverse societies. Local customs influenced Islamic practices, while disagreements over religious and political leadership contributed to distinct traditions, including Sunni and Shi’a Islam."},{"term":"Abbasid Caliphate","unit":1,"definition":"Islamic empire that ruled much of Middle East from 750 to 1258 governed from Baghdad. Created Islamic golden age.","example":"Used bureaucracy, meritocracy, infrastructure and taxing trade to expand. Shift away from these things helped lead to its collapse.","spice":["Political","Cultural","Economic"],"process":["State Consolidation","Political Fragmentation"],"why":"The Abbasids supported centers of learning, trade, and cultural exchange across Afro-Eurasia. Over time regional dynasties gained autonomy, illustrating how even influential empires can experience political fragmentation."},{"term":"Mongols","unit":1,"definition":"Pastoral nomadic peoples from Central Asian steppes united under Chinggis Khan creating largest land empire in history.","example":"Brutal Mongol conquest of China and Central Asia led to revival of Silk Road trade.","spice":["Social","Political","Economic"],"process":["State Formation & Expansion","Cultural Diffusion"],"why":"Short lived but disruption from conquests and forced migrations of peoples led to more cultural and religious diffusion/spread. Renewed European interests in exploring to find a way to Asia. Destroyed Abbasid Caliphate starting shift of power from Asia to Europe."},{"term":"Hinduism","unit":1,"definition":"Religion of many traditions all emphasizing karma, reincarnation, and liberation from cycle of rebirth. Sects focus on a god who embodies an aspect of a single god.","example":"Hinduism was created as a blend of many local religions in India leading to a society somewhat loosely connected by ideas.","spice":["Social","Cultural"],"process":["Social Organization & Change","Cultural Syncretism & Reform"],"why":"A key point of unity was the caste system based on the cycles of reincarnation. You are born to a status and cannot raise or lower it until your next life. Maintains social order but leads to constant unrest and hard to spread culture to other areas."},{"term":"Syncretism","unit":1,"definition":"Blending of beliefs, traditions, or cultural practices from different societies into a new form.","example":"Southeast Asia combined Hindu/Buddhist beliefs to create a political hierarchy. Bhakti Movement combined Hinduism and Islam to adapt to invading Mughal Empire.","spice":["Cultural"],"process":["Cultural Syncretism & Reform","Cultural Diffusion"],"why":"Allows imported religious ideas to become acceptable by adapting local customs and values. Blending often hints at major changes occurring in the world. Blending traditions could make new beliefs meaningful to communities with established practices."},{"term":"Matrilineal","unit":1,"definition":"System in which inheritance follows the mother's family line. Patrilineal is the opposite.","example":"Mayan society focused on empowerment of women. Opposite of most other societies.","spice":["Social","Political"],"process":["Social Organization & Change","Legitimization & Challenges to Authority"],"why":"Matrilineal inheritance traces family membership or property through the mother’s line, but does not automatically mean women hold all political power. Different inheritance customs shape families, wealth, and leadership succession."},{"term":"Mayan Society","unit":1,"definition":"Mesoamerican civilization organized around independent city states with hereditary elites and religious rulers.","example":"Loose structure of Mayan society prevented them from working together to survive climate change as rainfall dropped.","spice":["Social","Political","Environmental Interaction","Cultural"],"process":["Political Fragmentation","Environmental Adaptation & Change"],"why":"Independent Maya city-states produced major achievements in writing, astronomy, mathematics, and architecture. Rivalries, warfare, environmental pressures, and changing trade patterns affected different cities in different ways."},{"term":"Aztec Society","unit":1,"definition":"Highly centralized society composed of a god emperor, priest elite, and warrior class controlling vast number of slaves.","example":"Empire based on military conquest forcing vanquished to pay tribute.","spice":["Social","Political","Economic","Cultural"],"process":["State Formation & Expansion","State Consolidation"],"why":"The Mexica expanded their tribute empire through conquest and alliances, enriching Tenochtitlan while generating resentment among some subject peoples. Spanish invaders exploited those rivalries and gained essential Indigenous allies"},{"term":"Inca Society","unit":1,"definition":"Highly centralized state with a god emperor, feudal hierarchy, and taxes paid in labor.","example":"The mita labor system was used to gain massive amount of labor to build infrastructure like mountain roads, terraces, temples, and cities in mountains.","spice":["Social","Political","Environmental Interaction","Economic"],"process":["State Consolidation","Environmental Adaptation & Change"],"why":"The Inca used state-directed labor and roads to integrate their mountain empire and support agriculture and armies. Conflict over succession, disease, and alliances with groups resisting Inca rule aided the Spanish conquest."},{"term":"Theocracy","unit":1,"definition":"Political system where government claims it has divine approval from a god or gods.","example":"Inca and Aztec rulers claimed to be \"sun kings\" who control whether the sun rises or not. Disobey and night will stay!","spice":["Political"],"process":["Legitimization & Challenges to Authority","State Consolidation"],"why":"Where authority comes from changes your society. Power from gods means priests control and determine rules of society. Power from the people means people get to vote and decide."},{"term":"State Building in West Africa","unit":1,"definition":"Based on kinship ties with aversion to central authority. Centralized states grew from controlling Saharan trade and forced or slave labor.","e
